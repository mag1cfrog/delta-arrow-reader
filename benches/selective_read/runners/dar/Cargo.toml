[package]
name = "selective-read-dar"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[dependencies]
datafusion = { version = "=54.1.0", default-features = false, features = ["sql"] }
delta-arrow-reader = { path = "../../../..", features = ["datafusion"] }
futures-util = "=0.3.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }
url = "2"

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
debug = false
strip = "none"
panic = "unwind"
incremental = false
