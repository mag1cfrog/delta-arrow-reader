[package]
name = "selective-read-fixtures"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[dependencies]
arrow = "=58.4.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
datafusion = { version = "=54.1.0", default-features = false, features = ["parquet", "crypto_expressions", "string_expressions"] }
futures-util = "=0.3.33"
libc = "=0.2.189"
parquet = "=58.4.0"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }
tpchgen = "=3.0.0"
uuid = { version = "=1.24.0", features = ["v5"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
debug = false
strip = "none"
panic = "unwind"
incremental = false
