[workspace]
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

[[package]]
name = "delta-arrow-reader"
changelog_include = ["delta-arrow-reader-python"]

[[package]]
name = "delta-arrow-reader-python"
git_only = true
publish = false
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = false

[[package]]
name = "delta-arrow-reader-cli"
release = false
publish = false

[[package]]
name = "xtask"
release = false
publish = false

[changelog]
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^refactor", group = "changed" },
    { message = '^chore(?:\([^)]*\))?!', group = "changed" },
    { message = "^docs", group = "documentation" },
    { message = "^security", group = "security" },
    { message = "^(build|chore|style)", group = "maintenance" },
    { message = "^(ci|test)", skip = true },
    { message = "^.*", skip = true },
]
