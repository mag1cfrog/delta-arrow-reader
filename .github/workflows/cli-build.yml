name: Build CLI binaries

on:
  workflow_call:
    inputs:
      source-ref:
        description: Full lowercase source commit SHA to build
        required: true
        type: string
      expected-version:
        description: Optional workspace version to require, without a tag prefix
        required: false
        default: ''
        type: string
      cache-only:
        description: Warm main's dependency caches without release acceptance or artifact uploads
        type: boolean
        default: false
    outputs:
      validated:
        description: 'true only after source checks, both builds, all six runtime checks, and the complete artifact set pass'
        value: ${{ jobs.validate.outputs.validated }}
      source-commit:
        description: Full source commit used for both binaries
        value: ${{ jobs.prepare.outputs.source-commit }}
      version:
        description: Workspace version from the requested source commit
        value: ${{ jobs.prepare.outputs.version }}
      rust-toolchain:
        description: Exact Rust release used for both binaries
        value: ${{ jobs.prepare.outputs.rust-toolchain }}
      artifact-id:
        description: Immutable Actions artifact ID for the complete four-file set
        value: ${{ jobs.validate.outputs.artifact-id }}
      artifact-name:
        description: Actions artifact name for this run attempt
        value: ${{ jobs.validate.outputs.artifact-name }}
      artifact-url:
        description: Download page for the complete Actions artifact
        value: ${{ jobs.validate.outputs.artifact-url }}
      manifest-sha256:
        description: SHA256 of the complete cli-artifacts.json manifest
        value: ${{ jobs.validate.outputs.manifest-sha256 }}
  workflow_dispatch:
    inputs:
      source-ref:
        description: Full lowercase source commit SHA to validate
        required: true
        type: string
      expected-version:
        description: Optional workspace version to require, without a tag prefix
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  AWS_LC_SYS_USE_SYSTEM: "0"
  CI_TARGET_CACHE_VERSION: "3"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY
  RUSTC_WRAPPER: sccache

jobs:
  prepare:
    name: Check source and toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source-commit: ${{ steps.prepare.outputs.source-commit }}
      version: ${{ steps.prepare.outputs.version }}
      rust-toolchain: ${{ steps.prepare.outputs.rust-toolchain }}
      image: ${{ steps.prepare.outputs.image }}
      about-version: ${{ steps.prepare.outputs.about-version }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - name: Require trusted main cache warming
        if: inputs.cache-only
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$SOURCE_REF" != "$GITHUB_SHA" ]; then
            echo "Cache warming must build the triggering main commit"
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "Cache warming requires a main push or manual run"; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Validate source and resolve exact build identity
        id: prepare
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          cargo xtask cli prepare --source-commit "$SOURCE_REF" \
            --expected-version "$EXPECTED_VERSION" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"

  checks:
    name: Check CLI source and release tools
    needs: prepare
    if: ${{ !inputs.cache-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source-commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.prepare.outputs.rust-toolchain }}
          components: clippy
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Lint CLI and release tools
        run: |
          cargo clippy --locked -p delta-arrow-reader-cli --all-targets -- -D warnings
          cargo clippy --locked --package xtask --all-targets -- -D warnings
      - name: Test CLI source
        run: cargo test --locked -p delta-arrow-reader-cli
      - name: Test CLI release tools
        run: |
          cargo test --locked --package xtask --bin xtask \
            --test artifacts --test notices --test cli_workflow --test cli_images_workflow --test images --test unity_catalog_live

  build:
    name: Build Linux ${{ matrix.architecture }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
      CLI_SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
      CLI_VERSION: ${{ needs.prepare.outputs.version }}
      CLI_RUST_TOOLCHAIN: ${{ needs.prepare.outputs.rust-toolchain }}
      CLI_ARCHITECTURE: ${{ matrix.architecture }}
      CLI_IMAGE: ${{ needs.prepare.outputs.image }}
      CACHE_ONLY: ${{ inputs.cache-only || false }}
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source-commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.prepare.outputs.rust-toolchain }}
      - name: Cache Debian build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-debian-${{ matrix.architecture }}-${{ needs.prepare.outputs.image }}
          workspaces: . -> target/cli-debian
          cache-targets: true
          cache-bin: false
          # PR caches stay scoped to the merge ref; arbitrary sources cannot seed main.
          save-if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && inputs.source-ref == github.sha) }}
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@${{ needs.prepare.outputs.about-version }}
      - name: Build and package in pinned Debian 12
        run: |
          cli_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          cli_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          mkdir -p "$RUNNER_TEMP/cli-build" "$RUNNER_TEMP/cli-cargo" \
            "$cli_cargo_home/registry" "$cli_cargo_home/git" target/cli-debian
          docker run --rm --platform "linux/$CLI_ARCHITECTURE" \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$RUNNER_TEMP/cli-build:/build" \
            --volume "$GITHUB_WORKSPACE/target/cli-debian:/build/target" \
            --volume "$RUNNER_TEMP/cli-cargo:/cargo" \
            --volume "$cli_cargo_home/registry:/cargo/registry" \
            --volume "$cli_cargo_home/git:/cargo/git" \
            --volume "$cli_cargo_home/bin:/rustup-bin:ro" \
            --volume "$cli_rustup_home:/rustup:ro" \
            --volume "$(command -v cargo-about):/usr/local/bin/cargo-about:ro" \
            --workdir /source --env CARGO_HOME=/cargo --env RUSTUP_HOME=/rustup \
            --env PATH=/rustup-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env CARGO_BUILD_JOBS=4 \
            --env CARGO_PROFILE_DEV_DEBUG --env CARGO_INCREMENTAL \
            --env CLI_SOURCE_COMMIT --env CLI_VERSION --env CLI_RUST_TOOLCHAIN \
            --env CLI_ARCHITECTURE --env CACHE_ONLY \
            "$CLI_IMAGE" bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential binutils ca-certificates curl git pkg-config
              git config --global --add safe.directory /source
              if [ "$CACHE_ONLY" != "true" ]; then
                rustup run "$CLI_RUST_TOOLCHAIN" cargo test --locked --package xtask --bin xtask \
                  --target-dir /build/target native_build_preserves_metadata_and_rejects_source_changes \
                  -- --ignored
              fi
              rustup run "$CLI_RUST_TOOLCHAIN" cargo run --locked --package xtask \
                --target-dir /build/target -- cli build-archive \
                --source-commit "$CLI_SOURCE_COMMIT" --architecture "$CLI_ARCHITECTURE" \
                --version "$CLI_VERSION" --rust-toolchain "$CLI_RUST_TOOLCHAIN" \
                --target-dir /build/target --output /build/artifacts
              install -m 755 /build/target/debug/xtask /build/xtask
              strip --strip-debug /build/xtask
            '
      - name: Restore cache ownership after the container build
        if: always()
        run: |
          for directory in target/cli-debian "${CARGO_HOME:-$HOME/.cargo}/registry" "${CARGO_HOME:-$HOME/.cargo}/git"; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done
      - name: Upload platform archive
        if: ${{ !inputs.cache-only }}
        uses: actions/upload-artifact@v6
        with:
          name: dar-cli-${{ needs.prepare.outputs.source-commit }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/cli-build/artifacts/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 90
      - name: Upload native acceptance tool
        if: ${{ !inputs.cache-only }}
        uses: actions/upload-artifact@v6
        with:
          name: dar-cli-tools-${{ needs.prepare.outputs.source-commit }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/cli-build/xtask
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  runtime:
    name: Test ${{ matrix.distribution.name }} / ${{ matrix.platform.architecture }}
    needs: [prepare, build]
    if: ${{ !inputs.cache-only }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
        distribution:
          - name: Debian 12
            image: ${{ needs.prepare.outputs.image }}
          - name: Ubuntu 24.04
            image: docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          - name: Fedora 44
            image: registry.fedoraproject.org/fedora@sha256:1b8544582f974533fb8d9a5d6bf6dc2caf0d977ea54979d5e864a6ffd345c32e
    env:
      CLI_SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
      CLI_VERSION: ${{ needs.prepare.outputs.version }}
      CLI_RUST_TOOLCHAIN: ${{ needs.prepare.outputs.rust-toolchain }}
      CLI_ARCHITECTURE: ${{ matrix.platform.architecture }}
      CLI_IMAGE: ${{ matrix.distribution.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source-commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: dar-cli-${{ needs.prepare.outputs.source-commit }}-${{ matrix.platform.architecture }}
          path: ${{ runner.temp }}/cli-artifacts
      - uses: actions/download-artifact@v6
        with:
          name: dar-cli-tools-${{ needs.prepare.outputs.source-commit }}-${{ matrix.platform.architecture }}
          path: ${{ runner.temp }}/cli-tools
      - name: Validate and extract the archive outside the checkout
        run: |
          chmod 755 "$RUNNER_TEMP/cli-tools/xtask"
          "$RUNNER_TEMP/cli-tools/xtask" cli artifacts extract \
            "$RUNNER_TEMP/cli-artifacts" --destination "$RUNNER_TEMP/cli-extracted" \
            --architecture "$CLI_ARCHITECTURE" --version "$CLI_VERSION" \
            --source-commit "$CLI_SOURCE_COMMIT" --rust-toolchain "$CLI_RUST_TOOLCHAIN"
      - name: Execute archive acceptance tests in a fresh runtime
        run: |
          mkdir -p "$RUNNER_TEMP/cli-acceptance"
          docker run --rm --platform "linux/$CLI_ARCHITECTURE" \
            --volume "$GITHUB_WORKSPACE:/checks:ro" \
            --volume "$RUNNER_TEMP/cli-artifacts:/artifacts:ro" \
            --volume "$RUNNER_TEMP/cli-extracted:/package:ro" \
            --volume "$RUNNER_TEMP/cli-tools/xtask:/tools/xtask:ro" \
            --volume "$RUNNER_TEMP/cli-acceptance:/records" \
            --env DELTA_ARROW_READER_ACCEPTANCE_RECORDS=/records \
            --workdir /tmp \
            --env CLI_SOURCE_COMMIT --env CLI_VERSION --env CLI_RUST_TOOLCHAIN \
            --env CLI_ARCHITECTURE "$CLI_IMAGE" \
            bash /checks/crates/delta-arrow-reader-cli/release/validate-runtime.sh
      - name: Retain installed CLI invocation records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cli-acceptance-${{ matrix.distribution.name }}-${{ matrix.platform.architecture }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-acceptance/
          if-no-files-found: warn
          retention-days: 90

  validate:
    name: Validate complete CLI artifact set
    needs: [prepare, checks, build, runtime]
    if: ${{ always() && !inputs.cache-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.complete.outputs.validated }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.complete.outputs.artifact-name }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      manifest-sha256: ${{ steps.complete.outputs.manifest-sha256 }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
      PREPARE_RESULT: ${{ needs.prepare.result }}
      CHECKS_RESULT: ${{ needs.checks.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      RUNTIME_RESULT: ${{ needs.runtime.result }}
      CLI_SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
      CLI_VERSION: ${{ needs.prepare.outputs.version }}
      CLI_RUST_TOOLCHAIN: ${{ needs.prepare.outputs.rust-toolchain }}
      CLI_ARTIFACT_NAME: dar-cli-${{ needs.prepare.outputs.source-commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require source checks, both builds, and every runtime check
        run: |
          if [ "$PREPARE_RESULT" != success ] || [ "$CHECKS_RESULT" != success ] || \
             [ "$BUILD_RESULT" != success ] || [ "$RUNTIME_RESULT" != success ]; then
            echo "CLI validation failed: prepare=$PREPARE_RESULT, checks=$CHECKS_RESULT, build=$BUILD_RESULT, runtime=$RUNTIME_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source-commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: dar-cli-${{ needs.prepare.outputs.source-commit }}-amd64
          path: ${{ runner.temp }}/cli-inputs/amd64
      - uses: actions/download-artifact@v6
        with:
          name: dar-cli-${{ needs.prepare.outputs.source-commit }}-arm64
          path: ${{ runner.temp }}/cli-inputs/arm64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.prepare.outputs.rust-toolchain }}
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Assemble the original archives and check both identities
        run: |
          cargo xtask cli artifacts assemble \
            "$RUNNER_TEMP/cli-artifacts" --inputs "$RUNNER_TEMP/cli-inputs" \
            --version "$CLI_VERSION" --source-commit "$CLI_SOURCE_COMMIT" \
            --rust-toolchain "$CLI_RUST_TOOLCHAIN"
      - name: Upload complete artifact set
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CLI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/cli-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Report successful handoff
        id: complete
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$ARTIFACT_URL"
          manifest_sha256="$(sha256sum "$RUNNER_TEMP/cli-artifacts/cli-artifacts.json")"
          {
            echo "manifest-sha256=${manifest_sha256%% *}"
            echo 'validated=true'
            echo "artifact-name=$CLI_ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Source: $CLI_SOURCE_COMMIT"
            echo "Version: $CLI_VERSION; Rust: $CLI_RUST_TOOLCHAIN"
            echo "Validated Linux amd64 and arm64 on Debian 12, Ubuntu 24.04, and Fedora 44: [$CLI_ARTIFACT_NAME]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
