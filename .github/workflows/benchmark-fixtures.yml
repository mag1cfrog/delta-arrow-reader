name: Benchmark fixtures

on:
  workflow_call:

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY
  RUSTC_WRAPPER: sccache

jobs:
  fixtures:
    name: Build and validate fixtures
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/selective-read
      RUSTFLAGS: -C target-cpu=x86-64
      PYTHONDONTWRITEBYTECODE: '1'
      SELECTIVE_READ_XTASK: ${{ github.workspace }}/target/selective-read/debug/xtask
      SELECTIVE_READ_FIXTURES: ${{ github.workspace }}/target/selective-read/smoke
    defaults:
      run:
        working-directory: benches/selective_read

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches/selective_read -> ../../target/selective-read
          shared-key: selective-read-fixtures
          cache-targets: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo fmt -- --check
      - run: cargo clippy --release --locked --all-targets -j8 -- -D warnings
      - run: cargo test --release --locked -j8
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - name: Build native benchmark controller
        run: cargo build --locked --package xtask --manifest-path ../../Cargo.toml -j8
      - name: Validate oracle, production planner and Python SDK bridge
        env:
          SELECTIVE_READ_ORACLE_PYTHON: python
        run: |
          python -m pip install --require-hashes -r oracle-requirements.txt
          cargo test --locked --package xtask --bin xtask --manifest-path ../../Cargo.toml \
            selective_read -- --include-ignored --test-threads=1
          python -m unittest discover -p 'test_*.py'
