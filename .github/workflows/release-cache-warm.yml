name: Warm release build caches

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-build-caches
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, 'chore: release v') ||
       contains(github.event.head_commit.message, 'release-plz-'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      rust-version: ${{ steps.versions.outputs.rust-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read workspace versions
        id: versions
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          rust_version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          test -n "$rust_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rust-version=$rust_version" >> "$GITHUB_OUTPUT"

  wheels:
    needs: prepare
    uses: ./.github/workflows/pypi-build.yml
    with:
      source-ref: ${{ github.sha }}
      expected-version: ${{ needs.prepare.outputs.version }}
      cache-only: true

  cli:
    needs: prepare
    uses: ./.github/workflows/cli-build.yml
    with:
      source-ref: ${{ github.sha }}
      expected-version: ${{ needs.prepare.outputs.version }}
      cache-only: true

  prune:
    name: Retain current build caches
    needs: [prepare, wheels, cli]
    runs-on: ubuntu-latest
    concurrency:
      group: build-cache-pruning
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      pull-requests: read
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      AWS_LC_SYS_USE_SYSTEM: "0"
      CI_TARGET_CACHE_VERSION: "2"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.prepare.outputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo xtask prune-ci-caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
