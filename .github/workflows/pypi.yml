name: Python release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-to:
        description: Package index, or none to build and validate only
        required: true
        type: choice
        default: none
        options:
          - none
          - testpypi
          - pypi
      expected-version:
        description: Exact version without v; PyPI recovery on main uses the existing version tag
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  AWS_LC_SYS_USE_SYSTEM: "0"
  CI_TARGET_CACHE_VERSION: "2"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY
  RUSTC_WRAPPER: sccache

jobs:
  prepare:
    name: Validate release request and prepare wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      source-ref: ${{ steps.request.outputs.source-ref }}
      expected-version: ${{ steps.request.outputs.expected-version }}
      publish-to: ${{ steps.request.outputs.publish-to }}
      artifact-id: ${{ steps.wheels.outputs.artifact-id }}
      artifact-sha256: ${{ steps.wheels.outputs.artifact-sha256 }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Preserve release tools across source checkout
        run: |
          mkdir -p target
          mv target "$RUNNER_TEMP/python-release-target"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/python-release-target" >> "$GITHUB_ENV"
      - name: Check event, commit, tag, and version
        id: request
        run: cargo xtask check-python-release-request
      - name: Check out the verified package source
        if: steps.request.outputs.publish-to == 'pypi'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.request.outputs.source-ref }}
          persist-credentials: false
      - name: Retrieve validated release PR wheels
        if: steps.request.outputs.publish-to == 'pypi'
        id: wheels
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ steps.request.outputs.expected-version }}
        run: '"$CARGO_TARGET_DIR/debug/xtask" reuse-python-wheels wheel-artifacts --expected-version "$EXPECTED_VERSION"'

  build:
    name: Build and test wheels
    needs: prepare
    if: needs.prepare.outputs.publish-to != 'pypi'
    uses: ./.github/workflows/pypi-build.yml
    with:
      source-ref: ${{ needs.prepare.outputs.source-ref }}
      expected-version: ${{ needs.prepare.outputs.expected-version }}

  check:
    name: Require validated wheels
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      PREPARE_RESULT: ${{ needs.prepare.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      WHEELS_VALIDATED: ${{ needs.build.outputs.validated }}
      PUBLISH_TO: ${{ needs.prepare.outputs.publish-to }}
      ARTIFACT_ID: ${{ needs.prepare.outputs.artifact-id }}
      ARTIFACT_SHA256: ${{ needs.prepare.outputs.artifact-sha256 }}
    steps:
      - name: Check wheel source results
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "Python release preparation failed: $PREPARE_RESULT"
            exit 1
          fi
          case "$PUBLISH_TO" in
            pypi)
              if [ "$BUILD_RESULT" != "skipped" ] || [ -z "$ARTIFACT_ID" ] || [ -z "$ARTIFACT_SHA256" ]; then
                echo "PyPI requires the validated release PR artifact"
                exit 1
              fi
              ;;
            none|testpypi)
              if [ "$BUILD_RESULT" != "success" ] || [ "$WHEELS_VALIDATED" != "true" ]; then
                echo "Python wheel checks failed: build=$BUILD_RESULT validated=$WHEELS_VALIDATED"
                exit 1
              fi
              ;;
            *) echo "Unsupported publication target: $PUBLISH_TO"; exit 1 ;;
          esac
          echo "All supported platform wheels passed validation"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [prepare, check]
    if: >-
      !cancelled() &&
      github.repository == 'mag1cfrog/delta-arrow-reader' &&
      github.event_name == 'workflow_dispatch' &&
      needs.prepare.outputs.publish-to == 'testpypi' &&
      needs.check.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: testpypi-release
      url: https://test.pypi.org/project/delta-arrow-reader/
    concurrency:
      group: python-testpypi-${{ needs.prepare.outputs.expected-version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
      EXPECTED_VERSION: ${{ needs.prepare.outputs.expected-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/download-artifact@v6
        with:
          pattern: delta-arrow-reader-*-wheel
          path: wheel-artifacts
      - name: Verify published files and stage missing wheels
        id: stage
        run: |
          cargo xtask stage-python-wheels wheel-artifacts \
            --expected-version "$EXPECTED_VERSION" --index testpypi --destination dist
      - name: Upload to TestPyPI
        if: steps.stage.outputs.has-files == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: false

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, check]
    if: >-
      !cancelled() &&
      github.repository == 'mag1cfrog/delta-arrow-reader' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'release') &&
      needs.prepare.outputs.publish-to == 'pypi' &&
      needs.check.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/project/delta-arrow-reader/
    concurrency:
      group: python-pypi-${{ needs.prepare.outputs.expected-version }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
      EXPECTED_VERSION: ${{ needs.prepare.outputs.expected-version }}
      ARTIFACT_ID: ${{ needs.prepare.outputs.artifact-id }}
      ARTIFACT_SHA256: ${{ needs.prepare.outputs.artifact-sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Download verified release PR wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask download-python-wheels wheel-artifacts \
            --expected-version "$EXPECTED_VERSION" \
            --artifact-id "$ARTIFACT_ID" --sha256 "$ARTIFACT_SHA256"
      - name: Verify published files and stage missing wheels
        id: stage
        run: |
          cargo xtask stage-python-wheels wheel-artifacts \
            --expected-version "$EXPECTED_VERSION" --index pypi --destination dist
      - name: Upload to PyPI
        if: steps.stage.outputs.has-files == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: false
