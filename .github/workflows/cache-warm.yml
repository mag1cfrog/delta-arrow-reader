name: Warm CI caches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-warm.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/benchmark-fixtures.yml"
      - ".github/workflows/pypi-build.yml"
      - ".github/path-filters.json"
      - "xtask/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "crates/*/Cargo.toml"
      - "crates/delta-arrow-reader-python/**"
      - "crates/delta-arrow-reader-cli/**"
      - "crates/delta-arrow-reader-core/src/**"
      - "crates/delta-arrow-reader-core/tests/**"
      - "crates/delta-arrow-reader-core/benches/**"
      - "benches/**"

permissions:
  contents: read

concurrency:
  group: sccache-write
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare cache warming
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Read package version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  core:
    name: Warm core CI caches / ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      AWS_LC_SYS_USE_SYSTEM: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_LOG: sccache::server=debug
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: ${{ runner.os == 'Linux' && 'clippy' || '' }}
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          cache-targets: false
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          cache-targets: true
          # This action saves first; keep Cargo available for the registry cache save.
          cache-bin: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Verify Rust host
        shell: bash
        run: |
          rustc -vV | grep -F "host: ${{ matrix.target }}"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Warm core caches
        shell: bash
        run: &warm-core-caches |
          cargo test --locked --all-features --no-run
          cargo test --locked --no-run
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --locked -p delta-arrow-reader-python --no-run
            cargo test --locked -p delta-arrow-reader-cli --no-run
            cargo test --locked --package xtask --bin xtask --no-run
            cargo clippy --locked --all-targets --all-features -- -D warnings
            cargo clippy --locked -p delta-arrow-reader-python --all-targets -- -D warnings
            cargo clippy --locked -p delta-arrow-reader-cli --all-targets -- -D warnings
            cargo clippy --locked --package xtask --all-targets -- -D warnings
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps
          fi
      - name: Check sccache writes
        id: cache-writes
        continue-on-error: true
        run: cargo xtask check-cache-writes
        env:
          RUSTC_WRAPPER: ""
      - name: Prepare core cache write retry
        if: steps.cache-writes.outcome == 'failure'
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          sccache --stop-server
          cargo clean --target-dir target
          sleep 60
      - name: Retry core cache writes
        if: steps.cache-writes.outcome == 'failure'
        shell: bash
        run: *warm-core-caches
      - name: Check retried core cache writes
        if: steps.cache-writes.outcome == 'failure'
        run: cargo xtask check-cache-writes
        env:
          RUSTC_WRAPPER: ""

  prune:
    name: Retain two target caches per platform
    needs: core
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask prune-ci-caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  selective-read-fixtures:
    name: Warm benchmark fixture caches
    needs: core
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_LOG: sccache::server=debug
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
      RUSTC_WRAPPER: sccache
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/selective-read
      RUSTFLAGS: -C target-cpu=x86-64
    defaults:
      run:
        working-directory: benches/selective_read

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: clippy
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches/selective_read -> ../../target/selective-read
          shared-key: selective-read-fixtures
          cache-targets: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Warm benchmark caches
        run: &warm-benchmark-caches |
          cargo clippy --release --locked --all-targets -j8 -- -D warnings
          cargo test --release --locked -j8 --no-run
      - name: Check benchmark cache writes
        id: cache-writes
        continue-on-error: true
        working-directory: .
        run: cargo xtask check-cache-writes
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_DIR: ${{ runner.temp }}/benchmark-cache-check
      - name: Prepare benchmark cache write retry
        if: steps.cache-writes.outcome == 'failure'
        env:
          RUSTC_WRAPPER: ""
        run: |
          sccache --stop-server
          cargo clean --target-dir "$CARGO_TARGET_DIR"
          sleep 60
      - name: Retry benchmark cache writes
        if: steps.cache-writes.outcome == 'failure'
        run: *warm-benchmark-caches
      - name: Check retried benchmark cache writes
        if: steps.cache-writes.outcome == 'failure'
        working-directory: .
        run: cargo xtask check-cache-writes
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_DIR: ${{ runner.temp }}/benchmark-cache-check

  wheels:
    name: Warm Python wheel caches
    needs: [prepare, prune, selective-read-fixtures]
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/pypi-build.yml
    with:
      source-ref: ${{ github.sha }}
      expected-version: ${{ needs.prepare.outputs.version }}
      cache-only: true
