name: Build Python wheels

on:
  workflow_call:
    inputs:
      source-ref:
        description: Full commit SHA to build
        required: true
        type: string
      expected-version:
        description: Exact workspace package version, without a tag prefix
        required: true
        type: string
      cache-only:
        description: Warm main's build caches without uploading wheel artifacts
        type: boolean
        default: false
    outputs:
      validated:
        description: 'true only after all four platform artifacts pass validation'
        value: ${{ jobs.validate.outputs.validated }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            interpreter: python3.10
            platform-tag: manylinux_2_28_x86_64
            wheel-dir: dist
            venv-python: bin/python
            test-args: ''
            artifact: delta-arrow-reader-linux-x86_64-wheel
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            interpreter: python
            platform-tag: win_amd64
            wheel-dir: unrepaired-dist
            venv-python: Scripts/python.exe
            test-args: '-k installed'
            artifact: delta-arrow-reader-windows-x86_64-wheel
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: 'off'
            interpreter: python
            macos-deployment-target: '12.0'
            platform-tag: macosx_12_0_arm64
            wheel-dir: unrepaired-dist
            venv-python: bin/python
            test-args: '-k installed'
            artifact: delta-arrow-reader-macos-arm64-wheel
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
            interpreter: python
            macos-deployment-target: '12.0'
            platform-tag: macosx_12_0_x86_64
            wheel-dir: unrepaired-dist
            venv-python: bin/python
            test-args: '-k installed'
            artifact: delta-arrow-reader-macos-x86_64-wheel
    env:
      SOURCE_REF: ${{ inputs.source-ref }}
      EXPECTED_VERSION: ${{ inputs.expected-version }}
      CACHE_ONLY: ${{ inputs.cache-only }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ inputs.cache-only && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_LOG: ${{ inputs.cache-only && 'sccache::server=debug' || '' }}
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
      RUSTC_WRAPPER: ${{ matrix.manylinux == 'off' && 'sccache' || '' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref }}
      - name: Check build inputs and read Rust version
        id: versions
        run: |
          if [ "$CACHE_ONLY" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$SOURCE_REF" != "$GITHUB_SHA" ]; then
              echo "Cache warming must build the triggering main commit"
              exit 1
            fi
            case "$GITHUB_EVENT_NAME" in
              push|workflow_dispatch) ;;
              *) echo "Cache warming requires a main push or manual run"; exit 1 ;;
            esac
          fi
          source_sha="$(git rev-parse HEAD)"
          if [ "$source_sha" != "$SOURCE_REF" ]; then
            echo "Expected source commit $SOURCE_REF, checked out $source_sha"
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$EXPECTED_VERSION" ] || [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "Expected package version $EXPECTED_VERSION, checked out $version"
            exit 1
          fi
          rust_version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$rust_version"
          echo "rust-version=$rust_version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.versions.outputs.rust-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Stabilize Windows compiler outputs
        if: runner.os == 'Windows'
        run: |
          echo "CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=0" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=/Brepro --remap-path-prefix=${GITHUB_WORKSPACE}=." >> "$GITHUB_ENV"
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-wheels
          cache-targets: false
          save-if: ${{ inputs.cache-only }}
      - name: Prepare Cargo cache mounts
        if: runner.os == 'Linux'
        id: cargo-cache
        run: |
          cargo_cache="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_cache/registry" "$cargo_cache/git"
          echo "path=$cargo_cache" >> "$GITHUB_OUTPUT"
      - name: Set up sccache
        if: runner.os != 'Linux'
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.18.0
      - name: Prepare Linux source from sdist
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'maturin==1.14.1'
          maturin sdist --manifest-path crates/delta-arrow-reader-python/Cargo.toml --out "$RUNNER_TEMP/python-sdist"
          mkdir .python-sdist-source
          tar -xzf "$RUNNER_TEMP"/python-sdist/*.tar.gz -C .python-sdist-source --strip-components=1
          cmp Cargo.lock .python-sdist-source/Cargo.lock
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ runner.os == 'Linux' && '.python-sdist-source' || '.' }}
          command: build
          maturin-version: v1.14.1
          rust-toolchain: ${{ steps.versions.outputs.rust-version }}
          target: ${{ matrix.target }}
          container: ${{ runner.os == 'Linux' && 'quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae' || '' }}
          manylinux: ${{ matrix.manylinux }}
          sccache: ${{ runner.os == 'Linux' }}
          docker-options: >-
            --volume "${{ steps.cargo-cache.outputs.path }}/registry:/root/.cargo/registry"
            --volume "${{ steps.cargo-cache.outputs.path }}/git:/root/.cargo/git"
          before-script-linux: |
            dnf install -y openssl-devel
            printf 'sccache==0.16.0\n' > /tmp/sccache-constraints.txt
            export UV_CONSTRAINT=/tmp/sccache-constraints.txt
            export SCCACHE_ERROR_LOG=/tmp/sccache.log
            if [ "$SCCACHE_GHA_RW_MODE" = "READ_WRITE" ]; then
              trap 'python3 "$GITHUB_WORKSPACE/.github/scripts/check_sccache_writes.py"' EXIT
            fi
          args: >-
            --locked --release --out ${{ runner.os == 'Linux' && '../dist' || matrix.wheel-dir }} --target-dir target
            --manifest-path crates/delta-arrow-reader-python/Cargo.toml
            --compatibility pypi --auditwheel repair --interpreter ${{ matrix.interpreter }}
      - name: Check wheel cache writes
        if: inputs.cache-only && runner.os != 'Linux'
        run: python .github/scripts/check_sccache_writes.py
      - name: Inspect and repair Windows DLL dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: delvewheel
          python -m delvewheel show unrepaired-dist/*.whl
          python -m delvewheel repair --wheel-dir dist unrepaired-dist/*.whl
      - name: Inspect and repair macOS library dependencies
        if: runner.os == 'macOS'
        run: |
          python -m pip install --only-binary=:all: delocate
          delocate-wheel --verbose --require-archs "$(uname -m)" \
            --wheel-dir dist unrepaired-dist/*.whl
          delocate-listdeps --all dist/*.whl
      - name: Inspect wheel metadata
        run: |
          git diff --exit-code -- Cargo.lock
          python crates/delta-arrow-reader-python/tests/check_wheel.py dist/*.whl \
            --expected-version "$EXPECTED_VERSION" --platform-tag '${{ matrix.platform-tag }}'
      - name: Inspect Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          cmp Cargo.lock .python-sdist-source/Cargo.lock
          python -m pip install --only-binary=:all: auditwheel
          auditwheel show dist/*.whl
      - name: Test installed wheel on Python 3.10 and PyArrow 18.0.0
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv python310
          python310/${{ matrix.venv-python }} -m pip install --only-binary=:all: \
            "$GITHUB_WORKSPACE"/dist/*.whl 'pyarrow==18.0.0'
          python310/${{ matrix.venv-python }} -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/crates/delta-arrow-reader-python/tests" ${{ matrix.test-args }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Test installed wheel on Python 3.14 and current PyArrow
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv python314
          python314/${{ matrix.venv-python }} -m pip install --only-binary=:all: \
            "$GITHUB_WORKSPACE"/dist/*.whl
          python314/${{ matrix.venv-python }} -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/crates/delta-arrow-reader-python/tests" ${{ matrix.test-args }}
      - name: Upload validated wheel
        if: ${{ !inputs.cache-only }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  validate:
    name: Validate wheel artifact set
    needs: build
    if: ${{ always() && !inputs.cache-only }}
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.verify.outputs.validated }}
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      EXPECTED_VERSION: ${{ inputs.expected-version }}
    steps:
      - name: Require all platform builds to pass
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "Platform builds did not pass: $BUILD_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v6
        with:
          pattern: delta-arrow-reader-*-wheel
          path: wheel-artifacts
      - name: Check complete artifact set
        id: verify
        run: |
          python crates/delta-arrow-reader-python/tests/check_wheel.py wheel-artifacts \
            --artifact-set --expected-version "$EXPECTED_VERSION"
          echo "validated=true" >> "$GITHUB_OUTPUT"
