name: Build Python wheels

on:
  workflow_call:
    inputs:
      source-ref:
        description: Full commit SHA to build
        required: true
        type: string
      expected-version:
        description: Exact workspace package version, without a tag prefix
        required: true
        type: string
      cache-only:
        description: Warm main's dependency caches without release acceptance or artifact uploads
        type: boolean
        default: false
    outputs:
      validated:
        description: 'true only after all supported platform artifacts pass validation'
        value: ${{ jobs.validate.outputs.validated }}

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  AWS_LC_SYS_USE_SYSTEM: "0"
  CI_TARGET_CACHE_VERSION: "3"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY
  RUSTC_WRAPPER: sccache

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            interpreter: python3.10
            platform-tag: manylinux_2_28_x86_64
            wheel-dir: dist
            venv-python: bin/python
            test-args: ''
            artifact: delta-arrow-reader-linux-x86_64-wheel
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            interpreter: python
            platform-tag: win_amd64
            wheel-dir: unrepaired-dist
            venv-python: Scripts/python.exe
            test-args: '-k installed'
            artifact: delta-arrow-reader-windows-x86_64-wheel
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: 'off'
            interpreter: python
            macos-deployment-target: '12.0'
            platform-tag: macosx_12_0_arm64
            wheel-dir: unrepaired-dist
            venv-python: bin/python
            test-args: '-k installed'
            artifact: delta-arrow-reader-macos-arm64-wheel
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
      SOURCE_REF: ${{ inputs.source-ref }}
      EXPECTED_VERSION: ${{ inputs.expected-version }}
      CACHE_ONLY: ${{ inputs.cache-only }}
      DELTA_ARROW_READER_ACCEPTANCE_RECORDS: ${{ github.workspace }}/target/acceptance-records/wheel
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref }}
      - name: Check build inputs and read Rust version
        id: versions
        run: |
          if [ "$CACHE_ONLY" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$SOURCE_REF" != "$GITHUB_SHA" ]; then
              echo "Cache warming must build the triggering main commit"
              exit 1
            fi
            case "$GITHUB_EVENT_NAME" in
              push|workflow_dispatch) ;;
              *) echo "Cache warming requires a main push or manual run"; exit 1 ;;
            esac
          fi
          source_sha="$(git rev-parse HEAD)"
          if [ "$source_sha" != "$SOURCE_REF" ]; then
            echo "Expected source commit $SOURCE_REF, checked out $source_sha"
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$EXPECTED_VERSION" ] || [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "Expected package version $EXPECTED_VERSION, checked out $version"
            exit 1
          fi
          rust_version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$rust_version"
          echo "rust-version=$rust_version" >> "$GITHUB_OUTPUT"
          about_version="$(sed -n 's/^cargo-about-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$about_version"
          echo "cargo-about-version=$about_version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.versions.outputs.rust-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Stabilize Windows compiler outputs
        if: runner.os == 'Windows'
        run: |
          echo "CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=0" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=/Brepro --remap-path-prefix=${GITHUB_WORKSPACE}=." >> "$GITHUB_ENV"
      - name: Match Maturin's macOS dependency flags
        if: runner.os == 'macOS'
        run: |
          # CLI build.rs restores strict symbol resolution for the executable.
          echo "RUSTFLAGS=-C link-arg=-undefined -C link-arg=dynamic_lookup" >> "$GITHUB_ENV"
      - name: Restore host build dependencies
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@${{ steps.versions.outputs.cargo-about-version }}
      - name: Prepare Cargo cache mounts
        if: runner.os == 'Linux'
        id: cargo-cache
        run: |
          cargo_cache="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_cache/registry" "$cargo_cache/git" "$RUNNER_TEMP/python-build-tools"
          cp "$(command -v cargo-about)" "$RUNNER_TEMP/python-build-tools/cargo-about"
          echo "path=$cargo_cache" >> "$GITHUB_OUTPUT"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.18.0
      - name: Prepare Linux source from sdist
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'maturin==1.14.1' 'build>=1.2,<2'
          python -m build --sdist --no-isolation --outdir "$RUNNER_TEMP/python-sdist" crates/delta-arrow-reader-python
          mkdir .python-sdist-source
          tar -xzf "$RUNNER_TEMP"/python-sdist/*.tar.gz -C .python-sdist-source --strip-components=1
          cmp Cargo.lock .python-sdist-source/Cargo.lock
          cmp Cargo.toml .python-sdist-source/Cargo.toml
          cp .python-sdist-source/Cargo.lock "$RUNNER_TEMP/python-sdist/Cargo.lock"
      - name: Cache wheel build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # v2 keeps container tool dependencies outside Maturin's cleanup paths.
          shared-key: python-wheels-${{ matrix.target }}-v2-${{ runner.os == 'Linux' && env.MANYLINUX_IMAGE || matrix.platform-tag }}
          workspaces: ${{ runner.os == 'Linux' && '.python-sdist-source' || '.' }} -> target
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-targets: true
          cache-bin: false
          # PR caches stay scoped to the merge ref; arbitrary sources cannot seed main.
          save-if: ${{ inputs.cache-only || github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && inputs.source-ref == github.sha) }}
      - name: Prepare native wheel data
        if: runner.os != 'Linux'
        run: |
          rustup component add rust-docs
          cargo xtask build-python-wheel --prepare-only --include-cli \
            --project-directory crates/delta-arrow-reader-python \
            --target '${{ matrix.target }}' --profile release --target-dir "$PWD/target"
      - name: Build wheel
        id: wheel-build
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ runner.os == 'Linux' && '.python-sdist-source' || '.' }}
          command: build
          maturin-version: v1.14.1
          rust-toolchain: ${{ steps.versions.outputs.rust-version }}
          rustup-components: rust-docs
          # Match the staged CLI's explicit Cargo target on every platform.
          target: ${{ matrix.target }}
          container: ${{ runner.os == 'Linux' && env.MANYLINUX_IMAGE || '' }}
          manylinux: ${{ matrix.manylinux }}
          sccache: ${{ runner.os == 'Linux' }}
          docker-options: >-
            --volume "${{ steps.cargo-cache.outputs.path }}/registry:/root/.cargo/registry"
            --volume "${{ steps.cargo-cache.outputs.path }}/git:/root/.cargo/git"
            --volume "${{ runner.temp }}/python-build-tools:/opt/dar-tools:ro"
          before-script-linux: |
            # OpenSSL's build dependencies are all in BaseOS; skip unrelated mirrors.
            dnf install -y --repo=baseos openssl-devel
            printf 'sccache==0.16.0\n' > /tmp/sccache-constraints.txt
            export UV_CONSTRAINT=/tmp/sccache-constraints.txt
            export SCCACHE_ERROR_LOG=/tmp/sccache.log
            # Preparation runs before the action installs sccache for Maturin.
            uv tool install 'sccache>=0.10.0'
            export PATH="/opt/dar-tools:$PATH"
            # Keep the tool's cache outside Maturin's target/debug/build cleanup.
            CARGO_TARGET_DIR="$PWD/target/wheel-tools" cargo xtask build-python-wheel --prepare-only --include-cli --project-directory . \
              --target '${{ matrix.target }}' --profile release --target-dir "$PWD/target"
          args: >-
            --locked --release --out ${{ runner.os == 'Linux' && '../dist' || matrix.wheel-dir }}
            --target-dir "${{ runner.os == 'Linux' && format('{0}/.python-sdist-source/target', github.workspace) || 'target' }}"
            --manifest-path crates/delta-arrow-reader-python/Cargo.toml
            --compatibility pypi --auditwheel repair --interpreter ${{ matrix.interpreter }}
      - name: Restore cache ownership after the container build
        if: always() && runner.os == 'Linux'
        run: |
          for directory in .python-sdist-source/target "${CARGO_HOME:-$HOME/.cargo}/registry" "${CARGO_HOME:-$HOME/.cargo}/git"; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done
      - name: Inspect and repair Windows DLL dependencies
        if: ${{ !inputs.cache-only && runner.os == 'Windows' }}
        run: |
          python -m pip install --only-binary=:all: delvewheel
          python -m delvewheel show unrepaired-dist/*.whl
          python -m delvewheel repair --wheel-dir dist unrepaired-dist/*.whl
      - name: Inspect and repair macOS library dependencies
        if: ${{ !inputs.cache-only && runner.os == 'macOS' }}
        run: |
          python -m pip install --only-binary=:all: delocate
          delocate-wheel --verbose --require-archs "$(uname -m)" \
            --wheel-dir dist unrepaired-dist/*.whl
          delocate-listdeps --all dist/*.whl
      - name: Split library and CLI wheels
        if: ${{ !inputs.cache-only }}
        env:
          RUSTC_WRAPPER: ""
        run: |
          mv dist combined-dist
          cargo xtask split-python-wheel combined-dist/*.whl \
            --expected-version "$EXPECTED_VERSION" --platform-tag '${{ matrix.platform-tag }}' \
            --destination dist --symbols-directory "$RUNNER_TEMP/wheel-symbols"
      - name: Retain native symbols separately
        if: ${{ !inputs.cache-only }}
        uses: actions/upload-artifact@v6
        with:
          name: symbols-${{ matrix.artifact }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wheel-symbols/
            target/${{ matrix.target }}/release/*.pdb
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
      - name: Inspect wheel metadata
        if: ${{ !inputs.cache-only }}
        env:
          RUSTC_WRAPPER: ""
        run: |
          git diff --exit-code -- Cargo.lock
          cargo xtask check-python-wheel dist/*.whl \
            --expected-version "$EXPECTED_VERSION" --platform-tag '${{ matrix.platform-tag }}'
      - name: Inspect Linux native dependencies
        if: ${{ !inputs.cache-only && runner.os == 'Linux' }}
        run: |
          cmp "$RUNNER_TEMP/python-sdist/Cargo.lock" .python-sdist-source/Cargo.lock
          python -m pip install --only-binary=:all: auditwheel
          auditwheel show dist/delta_arrow_reader_py-[0-9]*.whl
      - name: Test installed wheel on Python 3.10 and PyArrow 18.0.0
        if: ${{ !inputs.cache-only }}
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv python310
          python310/${{ matrix.venv-python }} -m pip install --only-binary=:all: \
            "$GITHUB_WORKSPACE"/dist/delta_arrow_reader_py-[0-9]*.whl 'pyarrow==18.0.0'
          python310/${{ matrix.venv-python }} -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/crates/delta-arrow-reader-python/tests" ${{ matrix.test-args }}
      - name: Test independent CLI wheel
        if: ${{ !inputs.cache-only }}
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv cli310
          cli310/${{ matrix.venv-python }} -m pip install --only-binary=:all: \
            "$GITHUB_WORKSPACE"/dist/delta_arrow_reader-*.whl
          cli310/${{ matrix.venv-python }} -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/crates/delta-arrow-reader-cli/python_tests"
      - name: Audit installed wheel CLI
        if: ${{ !inputs.cache-only }}
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo xtask audit-python-cli \
            "$RUNNER_TEMP/cli310/${{ runner.os == 'Windows' && 'Scripts/dar.exe' || 'bin/dar' }}" \
            --platform-tag '${{ matrix.platform-tag }}'
      - uses: actions/setup-python@v6
        id: python314
        if: ${{ !inputs.cache-only }}
        with:
          python-version: '3.14'
      - name: Test installed wheel on Python 3.14 and current PyArrow
        if: ${{ !inputs.cache-only }}
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv python314
          python314/${{ matrix.venv-python }} -m pip install --only-binary=:all: \
            "$GITHUB_WORKSPACE"/dist/delta_arrow_reader_py-[0-9]*.whl
          python314/${{ matrix.venv-python }} -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/crates/delta-arrow-reader-python/tests" ${{ matrix.test-args }}
      - name: Test installed wheel on glibc 2.28
        if: ${{ !inputs.cache-only && runner.os == 'Linux' }}
        run: |
          mkdir -p "$DELTA_ARROW_READER_ACCEPTANCE_RECORDS"
          python_tests=crates/delta-arrow-reader-python/tests
          cli_tests=crates/delta-arrow-reader-cli/python_tests
          fixture=crates/delta-arrow-reader-core/tests/reader/fixtures/external_writer/corpus
          # Reuse the acceptance tool compiled inside the same manylinux baseline.
          docker run --rm --workdir /tmp \
            --env PATH=/usr/bin:/bin --env LD_LIBRARY_PATH= \
            --volume "$GITHUB_WORKSPACE/dist:/wheels:ro" \
            --volume "$GITHUB_WORKSPACE/$python_tests:/acceptance/$python_tests:ro" \
            --volume "$GITHUB_WORKSPACE/$cli_tests:/acceptance/$cli_tests:ro" \
            --volume "$GITHUB_WORKSPACE/$fixture:/acceptance/$fixture:ro" \
            --volume "$GITHUB_WORKSPACE/.python-sdist-source/target/wheel-tools/debug/xtask:/acceptance/xtask:ro" \
            --env DELTA_ARROW_READER_XTASK=/acceptance/xtask \
            --volume "$DELTA_ARROW_READER_ACCEPTANCE_RECORDS:/records" \
            --env DELTA_ARROW_READER_ACCEPTANCE_RECORDS=/records \
            --entrypoint /bin/bash "$MANYLINUX_IMAGE" -euo pipefail -c '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              for version in 310 314; do
                /opt/python/cp$version-cp$version/bin/python -m venv /tmp/python$version
                dependencies=()
                if [ "$version" = 310 ]; then
                  dependencies+=(pyarrow==18.0.0)
                fi
                /tmp/python$version/bin/python -m pip install --only-binary=:all: \
                  /wheels/delta_arrow_reader_py-[0-9]*.whl "${dependencies[@]}"
                /tmp/python$version/bin/python -I -m unittest discover \
                  -s /acceptance/crates/delta-arrow-reader-python/tests -k installed
                /opt/python/cp$version-cp$version/bin/python -m venv /tmp/cli$version
                /tmp/cli$version/bin/python -m pip install --only-binary=:all: /wheels/delta_arrow_reader-*.whl
                /tmp/cli$version/bin/python -I -m unittest discover \
                  -s /acceptance/crates/delta-arrow-reader-cli/python_tests
              done
            '
      - name: Test wheel with uv tool and uvx
        if: ${{ !inputs.cache-only }}
        working-directory: ${{ runner.temp }}
        env:
          UV_PYTHON: ${{ steps.python314.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
          UV_NO_BUILD: 'true'
        run: |
          python -m pip install --only-binary=:all: 'uv==0.10.0'
          tools="$(mktemp -d "$RUNNER_TEMP/wheel-tools.XXXXXX")"
          export UV_TOOL_DIR="$tools/environments"
          export UV_TOOL_BIN_DIR="$tools/bin"
          export UV_CACHE_DIR="$tools/cache"
          python -m uv tool install --no-config "$GITHUB_WORKSPACE"/dist/delta_arrow_reader-*.whl
          "$UV_TOOL_DIR/delta-arrow-reader/${{ matrix.venv-python }}" -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/crates/delta-arrow-reader-cli/python_tests" -k installed
          tool_version="$("$UV_TOOL_BIN_DIR/dar${{ runner.os == 'Windows' && '.exe' || '' }}" --version)"
          test "$tool_version" = "dar $EXPECTED_VERSION"
          # uv tool run is uvx; --isolated ignores the persistent tool above.
          python -m uv tool run --no-config --isolated --from "$GITHUB_WORKSPACE"/dist/delta_arrow_reader-*.whl \
            python -I -m unittest discover \
            -s "$GITHUB_WORKSPACE/crates/delta-arrow-reader-cli/python_tests" -k installed
          uvx_version="$(python -m uv tool run --no-config --isolated \
            --from "$GITHUB_WORKSPACE"/dist/delta_arrow_reader-*.whl dar --version)"
          test "$uvx_version" = "dar $EXPECTED_VERSION"
      - name: Retain installed CLI invocation records
        if: ${{ always() && !inputs.cache-only }}
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-${{ matrix.artifact }}-${{ github.run_attempt }}
          path: ${{ env.DELTA_ARROW_READER_ACCEPTANCE_RECORDS }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload validated wheel
        if: ${{ !inputs.cache-only }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: ${{ github.event_name == 'pull_request' }}

  validate:
    name: Validate wheel artifact set
    needs: build
    if: ${{ always() && !inputs.cache-only }}
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.complete.outputs.validated }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
      BUILD_RESULT: ${{ needs.build.result }}
      EXPECTED_VERSION: ${{ inputs.expected-version }}
    steps:
      - name: Require all platform builds to pass
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "Platform builds did not pass: $BUILD_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref }}
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/download-artifact@v6
        with:
          pattern: delta-arrow-reader-*-wheel
          path: wheel-artifacts
      - name: Check complete artifact set
        id: verify
        run: |
          cargo xtask check-python-artifacts wheel-artifacts --expected-version "$EXPECTED_VERSION"
          # Tree IDs still match after a squash merge if the source files are unchanged.
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "source-tree=$source_tree" >> "$GITHUB_OUTPUT"
      - name: Save release PR wheels
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: python-wheels-${{ steps.verify.outputs.source-tree }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheel-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Report validated wheel set
        id: complete
        run: |
          echo "validated=true" >> "$GITHUB_OUTPUT"
