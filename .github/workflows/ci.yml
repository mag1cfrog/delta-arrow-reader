name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY
  RUSTC_WRAPPER: sccache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.json

  feature-tests:
    name: Feature Tests / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Direct API
            features: ""
          - name: DataFusion
            features: --features datafusion

    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          cache-targets: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo test --locked ${{ matrix.features }}

  platform-tests:
    name: Platform Tests / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os == 'windows-2022' && 'core-ci-targets' || 'core-ci' }}
          cache-targets: ${{ matrix.os == 'windows-2022' }}
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Verify Rust host
        shell: bash
        run: |
          rustc -vV | grep -F "host: ${{ matrix.target }}"
      - run: cargo test --locked --all-features

  checks:
    name: ${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [Lints and Docs, Package]

    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          cache-targets: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - if: matrix.task == 'Lints and Docs'
        run: cargo fmt --all -- --check
      - if: matrix.task == 'Lints and Docs'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.task == 'Lints and Docs'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps
      - if: matrix.task == 'Lints and Docs'
        run: git diff --check
      - if: matrix.task == 'Package'
        run: cargo package --locked

  ci:
    name: CI
    needs: [changes, feature-tests, platform-tests, checks]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Detect Changes did not pass: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "No code changes detected"
            exit 0
          fi

          if [ "${{ needs.feature-tests.result }}" != "success" ]; then
            echo "Feature Tests did not pass: ${{ needs.feature-tests.result }}"
            exit 1
          fi

          if [ "${{ needs.platform-tests.result }}" != "success" ]; then
            echo "Platform Tests did not pass: ${{ needs.platform-tests.result }}"
            exit 1
          fi

          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "Checks did not pass: ${{ needs.checks.result }}"
            exit 1
          fi
