name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  # Keep file and line information in backtraces while reducing build artifacts.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Keep Python's pkg-config path from invalidating the bundled AWS-LC build.
  AWS_LC_SYS_USE_SYSTEM: "0"
  # Bump when cache warming adds build variants without dependency changes.
  CI_TARGET_CACHE_VERSION: "4"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY
  RUSTC_WRAPPER: sccache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust_docs: ${{ steps.filter.outputs.rust_docs }}
      tooling: ${{ steps.filter.outputs.tooling }}
      python: ${{ steps.filter.outputs.python }}
      cli: ${{ steps.filter.outputs.cli }}
      selective_read: ${{ steps.filter.outputs.selective_read }}
      package_version: ${{ steps.package-version.outputs.version }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      release_pr: >-
        ${{ github.repository == 'mag1cfrog/delta-arrow-reader' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.user.login == 'release-plz-bot-mag1cfrog[bot]' &&
            startsWith(github.head_ref, 'release-plz-') }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.json
      - name: Read workspace package version
        id: package-version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  feature-tests:
    name: Feature Tests / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Direct API
            features: ""
          - name: DataFusion
            features: --features datafusion

    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo test --locked ${{ matrix.features }}
      - name: Verify HTTPS certificates and proxies
        run: cargo xtask test-https ${{ matrix.features }}

  platform-tests:
    name: Platform Tests / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.tooling == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Verify Rust host
        shell: bash
        run: |
          rustc -vV | grep -F "host: ${{ matrix.target }}"
      - name: Test core
        if: needs.changes.outputs.code == 'true'
        run: cargo test --locked --all-features
      - name: Test CLI
        if: needs.changes.outputs.cli == 'true'
        env: &cli-test-concurrency
          # Let pipe, timeout, and credential-expiry waits overlap on small runners.
          RUST_TEST_THREADS: "8"
        run: cargo test --locked -p delta-arrow-reader-cli
      - name: Test offline Unity Catalog validation
        if: needs.changes.outputs.tooling == 'true'
        shell: bash
        run: &test-uc-validation |
          cargo test --locked --package xtask --bin xtask scan::ipc::
          cargo test --locked --package xtask --test unity_catalog_live

  checks:
    name: ${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [Lints and Docs, Package]

    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - if: matrix.task == 'Lints and Docs'
        run: |
          cargo test --locked --package xtask --bin xtask scan_scheduling::
          cargo test --locked --package xtask --test scan_scheduling
      - if: matrix.task == 'Lints and Docs'
        run: cargo fmt --all -- --check
      - if: matrix.task == 'Lints and Docs'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.task == 'Lints and Docs'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps
      - if: matrix.task == 'Lints and Docs'
        run: git diff --check
      - if: matrix.task == 'Package'
        run: cargo package --locked

  rust-docs:
    name: Rust Documentation
    needs: changes
    # Full code checks already build Rust documentation and test its examples.
    if: needs.changes.outputs.rust_docs == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest

    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Check Rust documentation and examples
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps
          cargo test --locked --doc
          cargo test --locked --all-features --doc
          git diff --check

  tooling-checks:
    name: CI Tools
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
      SCCACHE_LOG: sccache::cache::cache=warn
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log

    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install release-plz for release planning checks
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.3.171
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install wheel packager for packaging tests
        run: python -m pip install 'wheel==0.48.0'
      - name: Check CI workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: .github/workflows/ci.yml .github/workflows/cli-build.yml .github/workflows/cli-images.yml .github/workflows/cli-release.yml .github/workflows/pypi.yml .github/workflows/pypi-build.yml .github/workflows/cache-warm.yml .github/workflows/release-cache-warm.yml .github/workflows/benchmark-fixtures.yml
      - run: |
          cargo fmt --package xtask -- --check
          rustfmt --edition 2024 --check xtask/tests/unity_catalog_live/mock_cli.rs
      - name: Test CI workflows, Python, and cache tasks
        run: |
          cargo clippy --locked --package xtask --all-targets -- -D warnings
          cargo test --locked --package xtask --bin xtask
          cargo test --locked --package xtask --test notices
          cargo test --locked --package xtask --test cli_release_plan --test cli_release_assets --test cli_release_images \
            --test cli_release_request --test cli_release_notes --test cli_release_workflow
          cargo test --locked --package xtask \
            --test ci --test cli_workflow --test cli_images_workflow --test cli_validation_workflow --test cli_release_selection --test images --test python_release --test python_upload --test python_wheels \
            --test python_wheel_reuse --test python_wheel_split --test python_workflow --test python_build --test release_plz --test scan_scheduling --test selective_read_build --test selective_read -- --include-ignored
      - name: Test offline Unity Catalog validation
        run: *test-uc-validation
      - name: Report cache read failures
        continue-on-error: true
        run: cargo xtask report-cache-reads
        env:
          RUSTC_WRAPPER: ""
      - run: git diff --check

  python-package:
    name: Python Package
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Read Rust and cargo-about versions
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          about_version="$(sed -n 's/^cargo-about-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$about_version"
          echo "cargo-about-version=$about_version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt, rust-docs
      - run: cargo fmt --package delta-arrow-reader-python -- --check
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Lint Python bindings
        run: cargo clippy --locked -p delta-arrow-reader-python --all-targets -- -D warnings
      - name: Test Python runtime ownership
        run: cargo test --locked -p delta-arrow-reader-python
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@${{ steps.rust-version.outputs.cargo-about-version }}
      - name: Test Python build backend
        run: python -I -m unittest discover -s crates/delta-arrow-reader-python/build_tests
      - name: Restore license scan reports
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/license-reports
          key: license-reports-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml', 'LICENSE', 'crates/delta-arrow-reader-core/LICENSE', 'crates/delta-arrow-reader-cli/release/about.toml', 'xtask/src/notices.rs', 'xtask/src/notices/**') }}-${{ github.sha }}
          restore-keys: license-reports-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml', 'LICENSE', 'crates/delta-arrow-reader-core/LICENSE', 'crates/delta-arrow-reader-cli/release/about.toml', 'xtask/src/notices.rs', 'xtask/src/notices/**') }}-
      - name: Build Python package
        env:
          DAR_CI_LICENSE_REPORTS: ${{ runner.temp }}/license-reports
        run: |
          python -m venv "$RUNNER_TEMP/python-tests"
          source "$RUNNER_TEMP/python-tests/bin/activate"
          python -m pip install 'maturin==1.14.1' 'pyarrow==18.0.0'
          python -m pip install --verbose --no-build-isolation --no-deps --editable crates/delta-arrow-reader-python
      - name: Test Python API
        run: |
          "$RUNNER_TEMP/python-tests/bin/python" -I -m unittest discover -s crates/delta-arrow-reader-python/tests
      - name: Check generated Python API documentation
        run: |
          cargo run --locked -p delta-arrow-reader-python --example generate-api-docs -- \
            --python "$RUNNER_TEMP/python-tests/bin/python" --check

  cli-checks:
    name: CLI Source
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest

    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt
      - run: cargo fmt --package delta-arrow-reader-cli -- --check
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo clippy --locked -p delta-arrow-reader-cli --all-targets -- -D warnings
      - run: cargo test --locked -p delta-arrow-reader-cli
        env: *cli-test-concurrency

  release-approval:
    name: Approve release checks
    needs: changes
    if: needs.changes.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    environment: release-checks
    steps:
      - run: echo "Release checks approved for this PR revision"

  release-wheels:
    name: Release Python Wheels
    needs: [changes, release-approval]
    if: needs.changes.outputs.release_pr == 'true'
    uses: ./.github/workflows/pypi-build.yml
    with:
      source-ref: ${{ github.sha }}
      expected-version: ${{ needs.changes.outputs.package_version }}

  release-cli:
    name: Release CLI binaries
    needs: [changes, release-approval]
    if: needs.changes.outputs.release_pr == 'true'
    uses: ./.github/workflows/cli-build.yml
    with:
      source-ref: ${{ github.sha }}
      expected-version: ${{ needs.changes.outputs.package_version }}

  release-cli-images:
    name: Release CLI images and Go consumer
    needs: [changes, release-approval, release-cli]
    if: >-
      needs.changes.outputs.release_pr == 'true' &&
      needs.release-approval.result == 'success' &&
      needs.release-cli.result == 'success' &&
      needs.release-cli.outputs.validated == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cli-images.yml
    with:
      binary-artifact-id: ${{ needs.release-cli.outputs.artifact-id }}
      source-ref: ${{ needs.release-cli.outputs.source-commit }}
      expected-version: ${{ needs.release-cli.outputs.version }}
      rust-toolchain: ${{ needs.release-cli.outputs.rust-toolchain }}

  release-cli-record:
    name: Record validated CLI artifacts
    needs: [changes, release-approval, release-cli, release-cli-images]
    if: >-
      needs.changes.outputs.release_pr == 'true' &&
      needs.release-approval.result == 'success' &&
      needs.release-cli.result == 'success' &&
      needs.release-cli.outputs.validated == 'true' &&
      needs.release-cli-images.result == 'success' &&
      needs.release-cli-images.outputs.validated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      validated: ${{ steps.complete.outputs.validated }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.complete.outputs.artifact-name }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      source-commit: ${{ steps.record.outputs.source-commit }}
      pr-head-sha: ${{ steps.record.outputs.pr-head-sha }}
      version: ${{ steps.record.outputs.version }}
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup
      CLI_RECORD_NAME: dar-cli-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.release-cli.outputs.rust-toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci-targets
          env-vars: CI_TARGET_CACHE_VERSION
          cache-targets: true
          cache-bin: false
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Bind validated artifacts to the tested PR revision
        id: record
        env:
          CLI_JOB_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          printf '%s\n' "$CLI_JOB_RESULTS" > "$RUNNER_TEMP/cli-job-results.json"
          cargo xtask cli record-validation "$RUNNER_TEMP/cli-validation.json" \
            --event "$GITHUB_EVENT_PATH" --job-results "$RUNNER_TEMP/cli-job-results.json" \
            --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          jq -r '"source-commit=\(.source_commit)", "pr-head-sha=\(.pull_request_head_sha)", "version=\(.version)"' \
            "$RUNNER_TEMP/cli-validation.json" >> "$GITHUB_OUTPUT"
      - name: Upload CLI validation record
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CLI_RECORD_NAME }}
          path: ${{ runner.temp }}/cli-validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Require the uploaded record
        id: complete
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$ARTIFACT_URL"
          echo 'validated=true' >> "$GITHUB_OUTPUT"
          echo "artifact-name=$CLI_RECORD_NAME" >> "$GITHUB_OUTPUT"
          echo "CLI validation record: [$CLI_RECORD_NAME]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

  selective-read-fixtures:
    name: Public Fixture Smoke
    needs: changes
    if: needs.changes.outputs.selective_read == 'true'
    uses: ./.github/workflows/benchmark-fixtures.yml

  ci:
    name: CI
    needs: [changes, feature-tests, platform-tests, checks, rust-docs, tooling-checks, python-package, cli-checks, release-approval, release-wheels, release-cli, release-cli-images, release-cli-record, selective-read-fixtures]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Detect Changes did not pass: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.tooling }}" = "true" ] && \
             [ "${{ needs.tooling-checks.result }}" != "success" ]; then
            echo "CI Tools did not pass: ${{ needs.tooling-checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.code }}" = "true" ] || \
             [ "${{ needs.changes.outputs.tooling }}" = "true" ] || \
             [ "${{ needs.changes.outputs.cli }}" = "true" ]; then
            if [ "${{ needs.platform-tests.result }}" != "success" ]; then
              echo "Platform Tests did not pass: ${{ needs.platform-tests.result }}"
              exit 1
            fi
          fi

          if [ "${{ needs.changes.outputs.python }}" = "true" ]; then
            if [ "${{ needs.python-package.result }}" != "success" ]; then
              echo "Python Package did not pass: ${{ needs.python-package.result }}"
              exit 1
            fi
          fi

          if [ "${{ needs.changes.outputs.cli }}" = "true" ] && \
             [ "${{ needs.cli-checks.result }}" != "success" ]; then
            echo "CLI Source did not pass: ${{ needs.cli-checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.release_pr }}" = "true" ]; then
            if [ "${{ needs.release-approval.result }}" != "success" ]; then
              echo "Release approval did not pass"
              exit 1
            fi
            if [ "${{ needs.release-cli.result }}" != "success" ] || \
               [ "${{ needs.release-cli.outputs.validated }}" != "true" ]; then
              echo "Release CLI artifact validation did not pass"
              exit 1
            fi
            if [ "${{ needs.release-cli-images.result }}" != "success" ] || \
               [ "${{ needs.release-cli-images.outputs.validated }}" != "true" ] || \
               [ -z "${{ needs.release-cli-images.outputs.artifact-id }}" ] || \
               [ -z "${{ needs.release-cli-images.outputs.artifact-name }}" ] || \
               [ -z "${{ needs.release-cli-images.outputs.artifact-url }}" ] || \
               [ -z "${{ needs.release-cli-images.outputs.source-commit }}" ] || \
               [ "${{ needs.release-cli-images.outputs.source-commit }}" != "${{ needs.release-cli.outputs.source-commit }}" ] || \
               [ -z "${{ needs.release-cli-images.outputs.version }}" ] || \
               [ "${{ needs.release-cli-images.outputs.version }}" != "${{ needs.release-cli.outputs.version }}" ]; then
              echo "Release CLI image validation or artifact handoff did not pass"
              exit 1
            fi
            if [ "${{ needs.release-cli-record.result }}" != "success" ] || \
               [ "${{ needs.release-cli-record.outputs.validated }}" != "true" ] || \
               [ -z "${{ needs.release-cli-record.outputs.artifact-id }}" ] || \
               [ -z "${{ needs.release-cli-record.outputs.artifact-name }}" ] || \
               [ -z "${{ needs.release-cli-record.outputs.artifact-url }}" ] || \
               [ -z "${{ needs.release-cli-record.outputs.source-commit }}" ] || \
               [ "${{ needs.release-cli-record.outputs.source-commit }}" != "${{ needs.release-cli.outputs.source-commit }}" ] || \
               [ -z "${{ needs.release-cli-record.outputs.pr-head-sha }}" ] || \
               [ "${{ needs.release-cli-record.outputs.pr-head-sha }}" != "${{ needs.changes.outputs.pr_head_sha }}" ] || \
               [ -z "${{ needs.release-cli-record.outputs.version }}" ] || \
               [ "${{ needs.release-cli-record.outputs.version }}" != "${{ needs.release-cli.outputs.version }}" ]; then
              echo "Release CLI validation record upload or PR identity did not pass"
              exit 1
            fi
            if [ "${{ needs.release-wheels.result }}" != "success" ] || \
               [ "${{ needs.release-wheels.outputs.validated }}" != "true" ]; then
              echo "Release wheel artifact validation did not pass"
              exit 1
            fi
          fi

          if [ "${{ needs.changes.outputs.selective_read }}" = "true" ] && \
             [ "${{ needs.selective-read-fixtures.result }}" != "success" ]; then
            echo "Public Fixture Smoke did not pass: ${{ needs.selective-read-fixtures.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            if [ "${{ needs.changes.outputs.rust_docs }}" = "true" ] && \
               [ "${{ needs.rust-docs.result }}" != "success" ]; then
              echo "Rust Documentation did not pass: ${{ needs.rust-docs.result }}"
              exit 1
            fi
            echo "No code changes detected"
            exit 0
          fi

          if [ "${{ needs.feature-tests.result }}" != "success" ]; then
            echo "Feature Tests did not pass: ${{ needs.feature-tests.result }}"
            exit 1
          fi

          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "Checks did not pass: ${{ needs.checks.result }}"
            exit 1
          fi
