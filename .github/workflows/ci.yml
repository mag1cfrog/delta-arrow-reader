name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_ONLY
  RUSTC_WRAPPER: sccache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      python: ${{ steps.filter.outputs.python }}
      selective_read: ${{ steps.filter.outputs.selective_read }}
      package_version: ${{ steps.package-version.outputs.version }}
      release_pr: >-
        ${{ github.repository == 'mag1cfrog/delta-arrow-reader' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.user.login == 'release-plz-bot-mag1cfrog[bot]' &&
            startsWith(github.head_ref, 'release-plz-') }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.json
      - name: Read workspace package version
        id: package-version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  feature-tests:
    name: Feature Tests / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Direct API
            features: ""
          - name: DataFusion
            features: --features datafusion

    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          cache-targets: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo test --locked ${{ matrix.features }}
      - name: Verify HTTPS certificates and proxies
        run: python3 tests/reader/https.py ${{ matrix.features }}

  platform-tests:
    name: Platform Tests / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os == 'windows-2022' && 'core-ci-targets' || 'core-ci' }}
          cache-targets: ${{ matrix.os == 'windows-2022' }}
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Verify Rust host
        shell: bash
        run: |
          rustc -vV | grep -F "host: ${{ matrix.target }}"
      - run: cargo test --locked --all-features

  checks:
    name: ${{ matrix.task }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [Lints and Docs, Package]

    steps:
      - uses: actions/checkout@v5
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          cache-targets: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install release-plz for release planning checks
        if: matrix.task == 'Lints and Docs'
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.3.171
      - name: Check CI workflows
        if: matrix.task == 'Lints and Docs'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: .github/workflows/ci.yml .github/workflows/cli-build.yml .github/workflows/cli-images.yml .github/workflows/pypi.yml .github/workflows/pypi-build.yml .github/workflows/cache-warm.yml
      - name: Test CI workflows, Python, and cache tasks
        if: matrix.task == 'Lints and Docs'
        run: |
          cargo clippy --locked --package xtask --all-targets -- -D warnings
          cargo test --locked --package xtask --bin xtask cache_tests::
          cargo test --locked --package xtask \
            --test ci --test cli_workflow --test cli_images_workflow --test images --test python_release --test python_upload --test python_wheels \
            --test python_wheel_reuse --test python_workflow --test release_plz -- --include-ignored
      - if: matrix.task == 'Lints and Docs'
        run: python3 -m unittest discover -s benches -p test_scan_scheduling.py
      - if: matrix.task == 'Lints and Docs'
        run: cargo fmt --all -- --check
      - if: matrix.task == 'Lints and Docs'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.task == 'Lints and Docs'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps
      - if: matrix.task == 'Lints and Docs'
        run: git diff --check
      - if: matrix.task == 'Package'
        run: cargo package --locked

  python-package:
    name: Python Package
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          cache-targets: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Lint Python bindings
        run: cargo clippy --locked -p delta-arrow-reader-python --all-targets -- -D warnings
      - name: Test Python runtime ownership
        run: cargo test --locked -p delta-arrow-reader-python
      - name: Test Python API
        run: |
          python -m venv "$RUNNER_TEMP/python-tests"
          source "$RUNNER_TEMP/python-tests/bin/activate"
          python -m pip install 'maturin==1.14.1' 'pyarrow==18.0.0'
          maturin develop --locked
          python -I -m unittest discover -s crates/delta-arrow-reader-python/tests

  release-approval:
    name: Approve release checks
    needs: changes
    if: needs.changes.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    environment: release-checks
    steps:
      - run: echo "Release checks approved for this PR revision"

  release-wheels:
    name: Release Python Wheels
    needs: [changes, release-approval]
    if: needs.changes.outputs.release_pr == 'true'
    uses: ./.github/workflows/pypi-build.yml
    with:
      source-ref: ${{ github.sha }}
      expected-version: ${{ needs.changes.outputs.package_version }}

  release-cli:
    name: Release CLI binaries
    needs: [changes, release-approval]
    if: needs.changes.outputs.release_pr == 'true'
    uses: ./.github/workflows/cli-build.yml
    with:
      source-ref: ${{ github.sha }}
      expected-version: ${{ needs.changes.outputs.package_version }}

  release-cli-images:
    name: Release CLI images and Go consumer
    needs: [changes, release-approval, release-cli]
    if: >-
      needs.changes.outputs.release_pr == 'true' &&
      needs.release-approval.result == 'success' &&
      needs.release-cli.result == 'success' &&
      needs.release-cli.outputs.validated == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cli-images.yml
    with:
      binary-artifact-id: ${{ needs.release-cli.outputs.artifact-id }}
      source-ref: ${{ needs.release-cli.outputs.source-commit }}
      expected-version: ${{ needs.release-cli.outputs.version }}
      rust-toolchain: ${{ needs.release-cli.outputs.rust-toolchain }}

  selective-read-fixtures:
    name: Public Fixture Smoke
    needs: changes
    if: needs.changes.outputs.selective_read == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/selective-read
      RUSTFLAGS: -C target-cpu=x86-64
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: benches/selective_read

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches/selective_read -> ../../target/selective-read
          shared-key: selective-read-fixtures
          cache-targets: false
          save-if: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - run: cargo fmt -- --check
      - run: cargo clippy --release --locked --all-targets -j8 -- -D warnings
      - run: cargo test --release --locked -j8
      - name: Check fixture generator limits and executable replacement
        run: |
          cargo build --release --locked -j8
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path

          probe = Path(os.environ["RUNNER_TEMP"]) / "fixture-cli"
          shutil.copyfile(Path(os.environ["CARGO_TARGET_DIR"]) / "release/selective-read-fixtures", probe)
          probe.chmod(0o755)
          with probe.open("rb") as source:
              expected_hash = hashlib.file_digest(source, "sha256").hexdigest()
          output = probe.with_name("selective-read-smoke")
          process = subprocess.Popen([str(probe), "--profile", "smoke", "--sort-memory-mib", "16", "--output", str(output)])
          probe.unlink()  # Simulate a rebuild removing the running executable's old pathname.
          assert process.wait() == 0
          manifest = json.loads((output / "manifest.json").read_text())
          assert manifest["status"] == "complete"
          assert manifest["generator"]["executable_sha256"] == expected_hash
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - name: Validate independent oracle and public query results
        env:
          SELECTIVE_READ_FIXTURES: ${{ runner.temp }}/selective-read-smoke
        run: |
          python -m pip install --require-hashes -r oracle-requirements.txt
          python -m unittest -v test_oracle

  ci:
    name: CI
    needs: [changes, feature-tests, platform-tests, checks, python-package, release-approval, release-wheels, release-cli, release-cli-images, selective-read-fixtures]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Detect Changes did not pass: ${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.python }}" = "true" ]; then
            if [ "${{ needs.python-package.result }}" != "success" ]; then
              echo "Python Package did not pass: ${{ needs.python-package.result }}"
              exit 1
            fi
          fi

          if [ "${{ needs.changes.outputs.release_pr }}" = "true" ]; then
            if [ "${{ needs.release-approval.result }}" != "success" ]; then
              echo "Release approval did not pass"
              exit 1
            fi
            if [ "${{ needs.release-cli.result }}" != "success" ] || \
               [ "${{ needs.release-cli.outputs.validated }}" != "true" ]; then
              echo "Release CLI artifact validation did not pass"
              exit 1
            fi
            if [ "${{ needs.release-cli-images.result }}" != "success" ] || \
               [ "${{ needs.release-cli-images.outputs.validated }}" != "true" ] || \
               [ -z "${{ needs.release-cli-images.outputs.artifact-id }}" ] || \
               [ -z "${{ needs.release-cli-images.outputs.artifact-name }}" ] || \
               [ -z "${{ needs.release-cli-images.outputs.artifact-url }}" ] || \
               [ -z "${{ needs.release-cli-images.outputs.source-commit }}" ] || \
               [ "${{ needs.release-cli-images.outputs.source-commit }}" != "${{ needs.release-cli.outputs.source-commit }}" ] || \
               [ -z "${{ needs.release-cli-images.outputs.version }}" ] || \
               [ "${{ needs.release-cli-images.outputs.version }}" != "${{ needs.release-cli.outputs.version }}" ]; then
              echo "Release CLI image validation or artifact handoff did not pass"
              exit 1
            fi
            if [ "${{ needs.release-wheels.result }}" != "success" ] || \
               [ "${{ needs.release-wheels.outputs.validated }}" != "true" ]; then
              echo "Release wheel artifact validation did not pass"
              exit 1
            fi
          fi

          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "No code changes detected"
            exit 0
          fi

          if [ "${{ needs.feature-tests.result }}" != "success" ]; then
            echo "Feature Tests did not pass: ${{ needs.feature-tests.result }}"
            exit 1
          fi

          if [ "${{ needs.platform-tests.result }}" != "success" ]; then
            echo "Platform Tests did not pass: ${{ needs.platform-tests.result }}"
            exit 1
          fi

          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "Checks did not pass: ${{ needs.checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.selective_read }}" = "true" ] && \
             [ "${{ needs.selective-read-fixtures.result }}" != "success" ]; then
            echo "Public Fixture Smoke did not pass: ${{ needs.selective-read-fixtures.result }}"
            exit 1
          fi
