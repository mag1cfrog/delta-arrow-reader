name: Forks-only measurement checkpoint

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-platform:
    name: Forks-only core and CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_TEST_THREADS: "8"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Verify host and forks-only graph
        run: |
          rustc -vV | grep -F "host: ${{ matrix.target }}"
          cargo tree --locked -p delta-arrow-reader-cli --target "${{ matrix.target }}" --edges normal,build > forks-only-tree.txt
          python -c "import pathlib; p=pathlib.Path('forks-only-tree.txt'); p.write_text(p.read_text().replace(chr(92), '/'))"
          if grep -F 'delta-arrow-reader-spark-sql v' forks-only-tree.txt; then
            echo 'Spark must not be linked in this checkpoint.'
            exit 1
          fi
          for crate in arrow-array arrow-arith arrow-cast lexical-parse-float datafusion-common datafusion-datasource datafusion-expr datafusion-functions datafusion-functions-aggregate datafusion-optimizer datafusion-physical-expr datafusion-physical-expr-common datafusion-physical-optimizer datafusion-physical-plan datafusion-sql; do
            grep -F "vendor/dependencies/$crate" forks-only-tree.txt
          done
      - name: Build native CLI
        id: native-build
        run: cargo build --release --locked -p delta-arrow-reader-cli --target "${{ matrix.target }}"
      - name: Test core direct API
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: cargo test --locked -p delta-arrow-reader
      - name: Test core with DataFusion
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: cargo test --locked -p delta-arrow-reader --all-features
      - name: Test CLI
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: cargo test --locked -p delta-arrow-reader-cli
