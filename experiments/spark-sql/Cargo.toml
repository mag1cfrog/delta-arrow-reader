[package]
name = "delta-reader-sail-extraction-probe"
version = "0.1.0"
edition = "2024"

publish = false

[workspace]
exclude = ["vendor/sail", "vendor/sail/crates/*"]

[dependencies]
delta-arrow-reader = { path = "../..", features = ["datafusion"] }
datafusion = { version = "=54.1.0", default-features = false, features = ["sql"] }
arrow = "58.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
serde_json = "1"
sail-common = { path = "vendor/sail/crates/sail-common" }
sail-common-datafusion = { path = "vendor/sail/crates/sail-common-datafusion" }
sail-sql-analyzer = { path = "vendor/sail/crates/sail-sql-analyzer" }
sail-plan = { path = "vendor/sail/crates/sail-plan" }

[dev-dependencies]
# Reuse the reader's real-Parquet/DV fixture helper with the same resolved packages.
delta_kernel = { version = "=0.25.0", default-features = false, features = ["arrow", "internal-api"] }
parquet = "58.3.0"

[profile.dev]
debug = 0
incremental = false
