site_name: Delta Arrow Reader
site_url: https://mag1cfrog.github.io/delta-arrow-reader/
site_description: Read Delta Lake tables as Apache Arrow streams or DataFusion tables.
repo_name: mag1cfrog/delta-arrow-reader
repo_url: https://github.com/mag1cfrog/delta-arrow-reader
docs_dir: public
site_dir: .site

theme:
  name: material
  variant: modern
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      extend_pygments_lang:
        - name: no_run
          lang: rust
        - name: ignore
          lang: rust

nav:
  - Start here:
      - Overview: index.md
      - Installation: installation.md
      - Streaming reader quickstart: streaming-reader.md
      - Python quickstart: python.md
      - Command-line inspection: cli.md
      - DataFusion quickstart: datafusion.md
  - How it works:
      - Architecture: architecture.md
      - Delta metadata lifecycle: delta-metadata-lifecycle.md
      - Scan planning: scan-planning.md
      - Read scheduling: read-scheduling.md
  - Performance:
      - Overview: benchmarks.md
      - Selective reads on wide tables: benchmarks/selective-read-results.md
      - Repeated queries: benchmarks/eager-metadata.md
      - Predicate decoding: benchmarks/row-filter.md
      - Page-index reads: benchmarks/page-index.md
      - Range planning: benchmarks/range-planning.md
  - Reference:
      - Execution options: reference/execution-options.md
      - Scan metrics: reference/metrics.md
      - Rust API: https://docs.rs/delta-arrow-reader
