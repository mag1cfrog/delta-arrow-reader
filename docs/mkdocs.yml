site_name: Delta Arrow Reader
site_url: https://mag1cfrog.github.io/delta-arrow-reader/
site_description: Read Delta Lake tables as Apache Arrow streams or DataFusion tables.
repo_name: mag1cfrog/delta-arrow-reader
repo_url: https://github.com/mag1cfrog/delta-arrow-reader
docs_dir: content
site_dir: .site

theme:
  name: material
  variant: modern
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      extend_pygments_lang:
        - name: no_run
          lang: rust
        - name: ignore
          lang: rust

nav:
  - Start here:
      - Overview: index.md
      - Installation: installation.md
      - Streaming reader quickstart: streaming-reader.md
      - DataFusion quickstart: datafusion.md
  - How it works:
      - Architecture: architecture.md
      - Delta metadata lifecycle: delta-metadata-lifecycle.md
      - Scan planning: scan-planning.md
      - Read scheduling: read-scheduling.md
  - Performance:
      - Reader benchmarks: benchmarks.md
      - Public selective-read protocol: benchmarks/selective-read-protocol.md
      - Large-workload benchmark plan: benchmarks/selective-read-large-workloads.md
      - Generate public fixtures: benchmarks/selective-read-fixtures.md
      - Validate public results: benchmarks/selective-read-oracle.md
      - Run the reader comparisons: benchmarks/selective-read-runners.md
      - Observe storage requests: benchmarks/selective-read-storage.md
      - Run a selective-read campaign: benchmarks/selective-read-campaign.md
      - Compare predicates and projection width: benchmarks/selective-read-matrix.md
      - Compare file organizations: benchmarks/selective-read-files.md
      - Compare pruning inside files: benchmarks/selective-read-within-file.md
      - Compare deletion vectors: benchmarks/selective-read-deletion-vectors.md
      - Focused benchmarks:
          - Selective S3 case study: benchmarks/selective-s3.md
          - Lazy and eager scan metadata: benchmarks/eager-metadata.md
          - Parquet row-filter predicate decoding: benchmarks/row-filter.md
          - Parquet page-index range reads: benchmarks/page-index.md
          - Adaptive Parquet range planning: benchmarks/range-planning.md
  - Reference:
      - Execution options: reference/execution-options.md
      - Scan metrics: reference/metrics.md
      - Rust API: https://docs.rs/delta-arrow-reader
  - Contributors:
      - Project direction and Python: project-direction.md
      - Frozen Spark SQL experiment: spark-sql-experiment.md
      - Development: contributing.md
      - Extraction parity: benchmark-parity.md
      - Provenance: provenance.md
