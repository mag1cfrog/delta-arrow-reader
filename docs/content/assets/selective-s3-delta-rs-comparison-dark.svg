<line x1="95.00" y1="394" x2="95.00" y2="426" stroke="#2a3035"/>
<text x="95.00" y="454" text-anchor="middle" fill="#a2abb3" font-size="13">0</text>
<line x1="331.67" y1="394" x2="331.67" y2="426" stroke="#2a3035"/>
<text x="331.67" y="454" text-anchor="middle" fill="#a2abb3" font-size="13">1k</text>
<line x1="568.33" y1="394" x2="568.33" y2="426" stroke="#2a3035"/>
<text x="568.33" y="454" text-anchor="middle" fill="#a2abb3" font-size="13">2k</text>
<line x1="805.00" y1="394" x2="805.00" y2="426" stroke="#2a3035"/>
<text x="805.00" y="454" text-anchor="middle" fill="#a2abb3" font-size="13">3k</text>
<text x="32" y="416" fill="#edf0f2" font-size="18" font-weight="500">RSS</text>
<line x1="197.04" y1="410" x2="746.22" y2="410" stroke="#2a3035" stroke-width="2"/>
<circle cx="197.04" cy="410" r="5" fill="#7dd3fc"/>
<rect x="741.22" y="405" width="10" height="10" fill="#111417" stroke="#94a3b8" stroke-width="2"/>
</svg>
