<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title description">
<title id="title">Same laptop: Delta Arrow Reader and delta-rs</title>
<desc id="description">Median query time and peak process memory for Delta Arrow Reader and delta-rs on the same laptop. Delta Arrow Reader was faster on all four queries and used less peak memory. Lower is better.</desc>
<style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect width="840" height="500" fill="#111417"/>
<text x="32" y="40" fill="#edf0f2" font-size="26" font-weight="500">Same laptop: Delta Arrow Reader vs delta-rs</text>
<text x="32" y="66" fill="#a2abb3" font-size="14">Median query time and peak process RSS. Lower is better.</text>
<circle cx="410" cy="99" r="4" fill="#7dd3fc"/>
<text x="422" y="104" fill="#edf0f2" font-size="14">Delta Arrow Reader</text>
<rect x="646" y="95" width="8" height="8" fill="#111417" stroke="#94a3b8" stroke-width="2"/>
<text x="662" y="104" fill="#edf0f2" font-size="14">delta-rs</text>
<text x="32" y="130" fill="#a2abb3" font-size="14">Median query time, seconds (log scale)</text>
<line x1="95.00" y1="144" x2="95.00" y2="316" stroke="#2a3035"/>
<text x="95.00" y="341" text-anchor="middle" fill="#a2abb3" font-size="13">0.3</text>
<line x1="218.75" y1="144" x2="218.75" y2="316" stroke="#2a3035"/>
<text x="218.75" y="341" text-anchor="middle" fill="#a2abb3" font-size="13">1</text>
<line x1="331.67" y1="144" x2="331.67" y2="316" stroke="#2a3035"/>
<text x="331.67" y="341" text-anchor="middle" fill="#a2abb3" font-size="13">3</text>
<line x1="455.41" y1="144" x2="455.41" y2="316" stroke="#2a3035"/>
<text x="455.41" y="341" text-anchor="middle" fill="#a2abb3" font-size="13">10</text>
<line x1="568.33" y1="144" x2="568.33" y2="316" stroke="#2a3035"/>
<text x="568.33" y="341" text-anchor="middle" fill="#a2abb3" font-size="13">30</text>
<line x1="692.08" y1="144" x2="692.08" y2="316" stroke="#2a3035"/>
<text x="692.08" y="341" text-anchor="middle" fill="#a2abb3" font-size="13">100</text>
<line x1="805.00" y1="144" x2="805.00" y2="316" stroke="#2a3035"/>
<text x="805.00" y="341" text-anchor="middle" fill="#a2abb3" font-size="13">300</text>
<line x1="32" y1="182.00" x2="805" y2="182.00" stroke="#2a3035" stroke-dasharray="4 6"/>
<line x1="32" y1="226.00" x2="805" y2="226.00" stroke="#2a3035" stroke-dasharray="4 6"/>
<line x1="32" y1="270.00" x2="805" y2="270.00" stroke="#2a3035" stroke-dasharray="4 6"/>
<text x="32" y="166" fill="#edf0f2" font-size="18" font-weight="500">Q1</text>
<line x1="224.63" y1="160" x2="383.13" y2="160" stroke="#2a3035" stroke-width="2"/>
<circle cx="224.63" cy="160" r="5" fill="#7dd3fc"/>
<rect x="378.13" y="155" width="10" height="10" fill="#111417" stroke="#94a3b8" stroke-width="2"/>
<text x="32" y="210" fill="#edf0f2" font-size="18" font-weight="500">Q2</text>
<line x1="354.13" y1="204" x2="793.35" y2="204" stroke="#2a3035" stroke-width="2"/>
<circle cx="354.13" cy="204" r="5" fill="#7dd3fc"/>
<rect x="788.35" y="199" width="10" height="10" fill="#111417" stroke="#94a3b8" stroke-width="2"/>
<text x="32" y="254" fill="#edf0f2" font-size="18" font-weight="500">Q3</text>
<line x1="196.61" y1="248" x2="220.34" y2="248" stroke="#2a3035" stroke-width="2"/>
<circle cx="196.61" cy="248" r="5" fill="#7dd3fc"/>
<rect x="215.34" y="243" width="10" height="10" fill="#111417" stroke="#94a3b8" stroke-width="2"/>
<text x="32" y="298" fill="#edf0f2" font-size="18" font-weight="500">Q4</text>
<line x1="275.42" y1="292" x2="626.63" y2="292" stroke="#2a3035" stroke-width="2"/>
<circle cx="275.42" cy="292" r="5" fill="#7dd3fc"/>
<rect x="621.63" y="287" width="10" height="10" fill="#111417" stroke="#94a3b8" stroke-width="2"/>
