<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-labelledby="title description">
<title id="title">Selective S3 query wall time across four Delta engines</title>
<desc id="description">Each query has one row per engine. Horizontal lines show the minimum and maximum over eight measured rounds, and circles show the median. The horizontal axis uses a logarithmic scale. Lower is faster. The local reader used a Core Ultra 7 265H with 16 heterogeneous cores and 19 GiB of usable RAM. A published Pro or Classic Small warehouse has 24 Broadwell physical cores, 48 virtual CPUs, and 366 GiB of RAM. An AWS virtual CPU is one hardware thread, so the CPU counts are not equivalent compute measurements. The tested serverless hardware is not published.</desc>
<style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<defs><linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f8fa"/></linearGradient></defs>
<rect width="1200" height="875" fill="url(#page)"/>
