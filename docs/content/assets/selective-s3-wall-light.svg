<text x="44" y="72" fill="#1f2328" font-size="30" font-weight="700">Open source on a laptop vs managed Small warehouses</text>
<text x="44" y="101" fill="#59636f" font-size="16">Median and measured range over eight rounds. Lower is faster.</text>
