<text x="568.33" y="368" text-anchor="middle" fill="#68737d" font-size="13">20</text>
<line x1="805.00" y1="121" x2="805.00" y2="343" stroke="#e7e9e7"/>
<text x="805.00" y="368" text-anchor="middle" fill="#68737d" font-size="13">30</text>
<line x1="32" y1="174.00" x2="805" y2="174.00" stroke="#e7e9e7" stroke-dasharray="4 6"/>
<line x1="32" y1="232.00" x2="805" y2="232.00" stroke="#e7e9e7" stroke-dasharray="4 6"/>
