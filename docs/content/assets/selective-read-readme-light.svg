<text x="44" y="70" fill="#1f2328" font-size="32" font-weight="700">Faster Delta Lake reads</text>
<text x="44" y="99" fill="#68707d" font-size="16">Query time in seconds (median of 5 runs). Log scale; lower is faster.</text>
