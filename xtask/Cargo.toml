[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snafu = "0.9"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3"
