[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
arrow-array = "58.3.0"
arrow-ipc = "58.3.0"
arrow-schema = "58.3.0"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snafu = "0.9"
tar = { version = "0.4", default-features = false }
tempfile = "3"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
