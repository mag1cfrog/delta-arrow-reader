[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
arrow-array = "58.3.0"
arrow-cast = "58.3.0"
arrow-ipc = "58.3.0"
arrow-schema = "58.3.0"
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage"] }
csv = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rawzip = "0.5.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
snafu = "0.9"
tar = { version = "0.4", default-features = false }
tempfile = "3"
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }
url = "2"
uuid = { version = "1", features = ["v5"] }
z85 = "3"

[dev-dependencies]
serde_yaml_ng = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "snap", "zstd"] }
rustix = { version = "1", features = ["event", "pipe", "process", "pty", "thread"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
