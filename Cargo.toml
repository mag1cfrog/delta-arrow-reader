[workspace]
members = [
    "crates/delta-arrow-reader-core",
    "crates/delta-arrow-reader-cli",
    "crates/delta-arrow-reader-python",
    "xtask",
]
default-members = ["crates/delta-arrow-reader-core"]
resolver = "3"

[workspace.package]
version = "0.7.0"
rust-version = "1.94"

[workspace.lints.clippy]
mod_module_files = "deny"

[workspace.metadata.cli-release]
cargo-about-version = "0.9.2"
