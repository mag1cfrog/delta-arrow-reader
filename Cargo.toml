[workspace]
members = [
    "crates/delta-arrow-reader-core",
    "crates/delta-arrow-reader-cli",
    "crates/delta-arrow-reader-python",
    "xtask",
]
default-members = ["crates/delta-arrow-reader-core"]
exclude = ["crates/delta-arrow-reader-spark-sql"]
resolver = "3"

[workspace.package]
version = "0.9.2"
rust-version = "1.94"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
expect_used = "deny"
mod_module_files = "deny"
panic = "deny"
unwrap_used = "deny"

[workspace.metadata.cli-release]
cargo-about-version = "0.9.2"

[patch.crates-io]
arrow-arith = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/arrow-arith" }
arrow-array = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/arrow-array" }
arrow-cast = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/arrow-cast" }
datafusion-datasource = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-datasource" }
datafusion-common = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-common" }
datafusion-expr = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-expr" }
datafusion-functions = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-functions" }
datafusion-functions-aggregate = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-functions-aggregate" }
datafusion-optimizer = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-optimizer" }
datafusion-physical-expr = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-physical-expr" }
datafusion-physical-expr-common = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-physical-expr-common" }
datafusion-physical-optimizer = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-physical-optimizer" }
datafusion-physical-plan = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-physical-plan" }
datafusion-sql = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/datafusion-sql" }
lexical-parse-float = { path = "crates/delta-arrow-reader-spark-sql/vendor/dependencies/lexical-parse-float" }
