[package]
name = "delta-arrow-reader"
version = "0.5.3"
edition = "2024"
rust-version = "1.94"
description = "Read-only Delta Lake to Apache Arrow reader"
license = "Apache-2.0"
documentation = "https://docs.rs/delta-arrow-reader"
homepage = "https://github.com/mag1cfrog/delta-arrow-reader"
repository = "https://github.com/mag1cfrog/delta-arrow-reader"
readme = "README.md"
keywords = ["delta-lake", "arrow", "parquet", "datafusion"]
categories = ["asynchronous", "database"]
exclude = [
    ".github/**",
    ".gitignore",
    "benches/reader.rs",
    "benches/page_index.rs",
    "benches/range_planning.rs",
    "benches/range_planning/**",
    "benches/row_filter.rs",
    "tests/benchmark_harness.rs",
    "tests/page_index_benchmark_harness.rs",
    "tests/range_planning_benchmark_harness.rs",
    "tests/reader.rs",
    "tests/reader/**",
    "tests/row_filter_benchmark_harness.rs",
]

[[bench]]
name = "reader"
harness = false
required-features = ["datafusion", "experimental-parquet-metadata-preparation"]
test = false

[[bench]]
name = "row_filter"
harness = false
test = false

[[bench]]
name = "page_index"
harness = false
test = false

[[bench]]
name = "range_planning"
harness = false
test = false

[features]
datafusion = ["dep:datafusion"]
experimental-parquet-metadata-preparation = []

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[lints.rust]
missing_docs = "deny"

[lints.clippy]
expect_used = "deny"
mod_module_files = "deny"
panic = "deny"
unwrap_used = "deny"

[dependencies]
async-trait = "0.1"
arrow = "58.3.0"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
datafusion = { version = "54.1.0", default-features = false, features = ["sql"], optional = true }
delta_kernel = { version = "=0.25.0", default-features = false, features = ["arrow", "internal-api"] }
delta_kernel_default_engine = { version = "=0.25.0", default-features = false, features = ["arrow", "native-tls"] }
futures-util = "0.3"
object_store = "0.13.2"
parquet = { version = "58.3.0", features = ["async", "object_store"] }
snafu = "0.9"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }
