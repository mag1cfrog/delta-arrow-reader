[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "delta-arrow-reader"
dynamic = ["version"]
description = "Read-only Delta Lake to Apache Arrow reader"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyarrow>=18.0.0"]

[project.urls]
Repository = "https://github.com/mag1cfrog/delta-arrow-reader"
Issues = "https://github.com/mag1cfrog/delta-arrow-reader/issues"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/delta-arrow-reader-python/Cargo.toml"
# Preserve the complete workspace and its matching Cargo.lock in source archives.
sdist-generator = "git"
