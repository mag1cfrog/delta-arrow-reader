[package]
name = "delta-arrow-reader-cli"
version.workspace = true
edition = "2024"
rust-version = "1.94"
license-file = "../../LICENSE"
repository = "https://github.com/mag1cfrog/delta-arrow-reader"
description = "Command-line inspection of Delta Lake tables"
publish = false

[[bin]]
name = "dar"
path = "src/main.rs"

[dependencies]
arrow-schema = { version = "58.3.0", features = ["serde"] }
delta-arrow-reader = { path = "../.." }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
arrow = "58.3.0"
