[package]
name = "delta-arrow-reader-cli"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
repository = "https://github.com/mag1cfrog/delta-arrow-reader"
description = "Command-line reading of Delta Lake tables"
publish = false

[lints]
workspace = true

[[bin]]
name = "dar"
path = "src/main.rs"

[dependencies]
arrow = "58.3.0"
arrow-schema = { version = "58.3.0", features = ["serde"] }
async-trait = "0.1"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
datafusion = { version = "54.1.0", default-features = false, features = ["sql"] }
delta-arrow-reader = { path = "../delta-arrow-reader-core", features = ["datafusion"] }
futures-util = "0.3"
num-traits = "0.2"
object_store = { version = "0.13.2", features = ["aws", "azure", "gcp"] }
serde = { version = "1", features = ["derive"] }
serde-value = "0.7.0"
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde_path_to_error = "0.1"
snafu = "0.9"
strum = { version = "0.27", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "signal", "macros"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
