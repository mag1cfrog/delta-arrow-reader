site_name: Delta Arrow Reader
site_url: https://mag1cfrog.github.io/delta-arrow-reader/
site_description: Read Delta Lake tables as Apache Arrow streams or DataFusion tables.
repo_name: mag1cfrog/delta-arrow-reader
repo_url: https://github.com/mag1cfrog/delta-arrow-reader
docs_dir: public
site_dir: .site

theme:
  name: material
  variant: modern
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python_api]
          options:
            allow_inspection: false
            show_source: false
            separate_signature: true
            line_length: 80
            show_signature_annotations: true
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            group_by_category: false
            members_order: source

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      # API docstrings render separately, so line-number anchors would repeat.
      anchor_linenums: false
      extend_pygments_lang:
        - name: no_run
          lang: rust
        - name: ignore
          lang: rust

nav:
  - Start here:
      - Overview: index.md
      - Installation: installation.md
      - Command-line quickstart: cli-quickstart.md
      - Read Unity Catalog tables: unity-catalog.md
  - Command line:
      - Everyday tasks:
          - Filter, group, and join: cli-workflows.md
          - Connect to storage: cli-storage.md
          - Fix a failed command: cli-recovery.md
      - Advanced workflows:
          - Automation and saved results: cli-automation.md
          - Verify JSON results: cli-verify-json.md
          - Verify Arrow results: cli-verify-arrow.md
  - Python:
      - Overview: python-api/index.md
      - Quickstart: python.md
      - Common tasks:
          - Connect to storage: configuration.md
          - Handle errors: python-api/errors.md
          - Enable logging: python-api/logging.md
      - API reference:
          - DeltaTable: python-api/table.md
          - Session: python-api/session.md
          - ScanExecutionOptions: python-api/options.md
      - Advanced integration:
          - Arrow stream interface: python-api/streams-and-errors.md
          - Log records and handlers: reference/python-logging.md
  - Rust:
      - Quickstart: streaming-reader.md
      - DataFusion integration: datafusion.md
      - Diagnose a read: diagnostics.md
  - How it works:
      - How a read works: architecture.md
      - Reusing a loaded table: delta-metadata-lifecycle.md
      - Scan planning: scan-planning.md
      - Read scheduling: read-scheduling.md
      - Partial-page reads: partial-page-reads.md
  - Performance:
      - Overview: benchmarks.md
      - Selective reads on wide tables: benchmarks/selective-read-results.md
      - Repeated queries: benchmarks/eager-metadata.md
      - Decoding filter columns: benchmarks/row-filter.md
      - Skipping pages: benchmarks/page-index.md
      - Combining read requests: benchmarks/range-planning.md
  - Reference:
      - Command line:
          - Command-line reference: cli.md
          - Unity Catalog access: reference/unity-catalog.md
          - CLI diagnostics reference: reference/cli-diagnostics.md
      - Rust:
          - Renewable storage credentials: reference/storage-credentials.md
          - Execution options: reference/execution-options.md
          - Scan metrics: reference/metrics.md
          - Tracing event reference: reference/tracing.md
          - Rust API: https://docs.rs/delta-arrow-reader
