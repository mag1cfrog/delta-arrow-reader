[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "delta-arrow-reader-py"
dynamic = ["version"]
description = "Read-only Delta Lake to Apache Arrow reader"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyarrow>=18.0.0"]

[project.urls]
Repository = "https://github.com/mag1cfrog/delta-arrow-reader"
Issues = "https://github.com/mag1cfrog/delta-arrow-reader/issues"

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
profile = "release"
editable-profile = "dev"
# Maturin auto-detects delta_arrow_reader.data after xtask prepares it.
exclude = [
    { path = "**/delta_arrow_reader.data/**", format = "sdist" },
    { path = "**/.python-wheel-*/**", format = "sdist" },
    { path = "**/.python-cli-*/**", format = "sdist" },
]
# Keep auto-detected package files beside the sdist's root pyproject.toml.
include = [
    { path = "build_backend.py", format = "sdist" },
    { path = "delta_arrow_reader.pyi", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
]

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "12.0"
