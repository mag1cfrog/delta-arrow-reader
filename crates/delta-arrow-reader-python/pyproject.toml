[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "delta-arrow-reader"
dynamic = ["version"]
description = "Read-only Delta Lake to Apache Arrow reader"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyarrow>=18.0.0"]

[project.urls]
Repository = "https://github.com/mag1cfrog/delta-arrow-reader"
Issues = "https://github.com/mag1cfrog/delta-arrow-reader/issues"

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
# Keep auto-detected package files beside the sdist's root pyproject.toml.
include = [
    { path = "delta_arrow_reader.pyi", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
]
